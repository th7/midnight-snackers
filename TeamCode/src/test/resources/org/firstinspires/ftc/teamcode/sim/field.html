<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The field</title>
<style>
  :root {
    --bg: #11161c; --panel: #1a222b; --line: #2b3742; --text: #dfe7ee; --dim: #8fa0af;
  }
  @media (prefers-color-scheme: light) {
    :root { --bg: #eef2f5; --panel: #ffffff; --line: #cfd8e0; --text: #1b2430; --dim: #5d6b79; }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--text); overflow: hidden;
    font: 13px/1.5 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  canvas { display: block; touch-action: none; }
  #hud {
    position: fixed; top: 12px; left: 12px; padding: 10px 12px; border-radius: 8px;
    background: color-mix(in srgb, var(--panel) 88%, transparent);
    border: 1px solid var(--line); max-width: min(360px, calc(100vw - 24px));
  }
  #hud h1 { margin: 0 0 4px; font-size: 13px; font-weight: 600; }
  #hud p { margin: 0; color: var(--dim); }
  #hud kbd {
    border: 1px solid var(--line); border-radius: 4px; padding: 0 4px;
    background: var(--bg); font: inherit; font-size: 12px;
  }
  #problem { color: #e06c75; white-space: pre-wrap; }
  #run[hidden] { display: none; }
  #run {
    position: fixed; left: 50%; transform: translateX(-50%); bottom: 14px;
    display: flex; gap: 10px; align-items: center; padding: 8px 12px; border-radius: 10px;
    background: color-mix(in srgb, var(--panel) 92%, transparent);
    border: 1px solid var(--line); width: min(720px, calc(100vw - 24px));
  }
  #run button {
    font: inherit; color: var(--text); background: var(--bg); cursor: pointer;
    border: 1px solid var(--line); border-radius: 6px; padding: 3px 10px; min-width: 62px;
  }
  #scrub { flex: 1; accent-color: #4c8dff; }
  #clock { color: var(--dim); font-variant-numeric: tabular-nums; white-space: nowrap; }
</style>
<script type="importmap">
{
  "imports": {
    "three": "./assets/vendor/three.module.min.js",
    "three/addons/": "./assets/vendor/jsm/"
  }
}
</script>
</head>
<body>
<div id="hud">
  <h1>The field</h1>
  <p id="said">Loading the model&hellip;</p>
  <p id="problem"></p>
</div>
<div id="run" hidden>
  <button id="play" type="button">Play</button>
  <input id="scrub" type="range" min="0" max="0" value="0" step="1" aria-label="loop">
  <span id="clock"></span>
</div>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const said = document.getElementById('said');
const problem = document.getElementById('problem');

// The model is in Road Runner's frame: inches, z up, the origin in the middle of the floor.
// three.js is y up by default, so everything made after this is told otherwise rather than the
// scene being turned, which would put the model's own axes at odds with the numbers on it.
THREE.Object3D.DEFAULT_UP.set(0, 0, 1);

const FIELD_IN = 141.17;
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const styles = getComputedStyle(document.documentElement);
scene.background = new THREE.Color(styles.getPropertyValue('--bg').trim() || '#11161c');

const camera = new THREE.PerspectiveCamera(38, 1, 1, 4000);
camera.position.set(-170, -190, 130);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 0, 18);
controls.enableDamping = true;
controls.maxPolarAngle = Math.PI / 2 - 0.02; // no going under the floor
controls.minDistance = 30;
controls.maxDistance = 900;

// A key light high on the audience's left, a soft fill from the sky, and a little bounce from
// the floor, which is what stops the undersides reading as black.
const key = new THREE.DirectionalLight(0xffffff, 2.1);
key.position.set(-120, -160, 260);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
key.shadow.camera.near = 40;
key.shadow.camera.far = 700;
const reach = FIELD_IN * 1.1;
Object.assign(key.shadow.camera, { left: -reach, right: reach, top: reach, bottom: -reach });
key.shadow.bias = -0.0015;
scene.add(key);
scene.add(new THREE.HemisphereLight(0xbfd4e8, 0x2a2f36, 1.0));

// The floor is the floor, at z = 0, where the CAD's soft tiles put it and where everything
// standing on the field is measured from. The gaffer tape's top face is at z = 0 too, and two
// surfaces in one plane leave which of them a pixel belongs to up to rounding error -- the tape
// flickering as the camera moves. So the tape is lifted a hundredth of an inch instead, which
// settles it and keeps the floor where it belongs.
const FLOOR_Z = 0;
const TAPE_Z = 0.01;
// three.js renames a node as it loads it -- a space becomes an underscore, and a name used twice
// gets a number -- so what the CAD calls "FTC Field Side Glass 11in" is "FTC_Field_Side_Glass_11in"
// here. Anything matching on a part's name has to allow for that, or it silently matches nothing.
const SEE_THROUGH = /skin|side[\s_]glass/i;
const floor = new THREE.Mesh(
    new THREE.PlaneGeometry(FIELD_IN, FIELD_IN),
    new THREE.MeshStandardMaterial({ color: 0x20262e, roughness: 0.95, metalness: 0 }));
floor.position.z = FLOOR_Z;
floor.receiveShadow = true;
scene.add(floor);

const tiles = new THREE.GridHelper(FIELD_IN, 6, 0x4a5a68, 0x33414d);
tiles.rotation.x = Math.PI / 2; // GridHelper lies in xz; the field's floor is xy
tiles.position.z = FLOOR_Z + 0.02;
scene.add(tiles);

function fit() {
  const width = window.innerWidth;
  const height = window.innerHeight;
  renderer.setSize(width, height);
  camera.aspect = width / height;
  camera.updateProjectionMatrix();
}
window.addEventListener('resize', fit);
fit();

let loaded = null;

new GLTFLoader().load('./assets/field.glb', (gltf) => {
  let meshes = 0;
  let triangles = 0;
  gltf.scene.traverse((object) => {
    if (!object.isMesh) {
      return;
    }
    meshes++;
    triangles += object.geometry.index ? object.geometry.index.count / 3
                                       : object.geometry.attributes.position.count / 3;
    object.castShadow = true;
    object.receiveShadow = true;
    // The export carries no normals, so a flat-shaded part would come out unlit.
    if (!object.geometry.attributes.normal) {
      object.geometry.computeVertexNormals();
    }
    object.material.roughness = 0.62;
    object.material.metalness = 0.05;

    // Lifted off the floor it is stuck to, so the two do not fight for the same pixels.
    if (/tape/i.test(object.name)) {
      object.position.z += TAPE_Z;
    }

    // What is transparent in the real field and would hide the match if it were not here: a
    // hive's skins, which are the walls of the basket a ball is scored in, and the perimeter's
    // side glass, which is the polycarbonate the whole field is watched through. The CAD gives
    // both the same near-white it gives anything uncoloured, so they have to be named. Drawn
    // from both sides, since a see-through box is looked into as well as at.
    if (SEE_THROUGH.test(object.name)) {
      object.material = object.material.clone();
      object.material.transparent = true;
      object.material.opacity = 0.22;
      object.material.side = THREE.DoubleSide;
      object.material.depthWrite = false;
      object.castShadow = false;
    }
  });
  scene.add(gltf.scene);
  field = gltf.scene;
  loaded = { parts: meshes, triangles: triangles };
  said.textContent = meshes + ' parts, ' + triangles.toLocaleString() + ' triangles. '
      + 'Drag to orbit, scroll to zoom.';
  showRun();
}, undefined, (wrong) => {
  said.textContent = 'The field did not load.';
  problem.textContent = String(wrong && wrong.message ? wrong.message : wrong);
});

// --- a run -------------------------------------------------------------------------------
// `?run=<id>` plays one back: the robot where the simulator had it, the game pieces where they
// had rolled to, and each hive leaning the way the run left it. The geometry is all in the model
// already; what a tick carries is where it had moved to.

let field = null;
let model = null;
let ticks = [];
let moved = [];       // the pieces a tick lists, in the order it lists them
let movingBalls = []; // one sphere per entry a tick lists, in the order it lists them
let staticBalls = []; // the pieces no tick lists: the rows set out beyond the walls
let hives = [];       // { group, pivot, rest }
let robot = null;
let at = 0;
let playing = false;
let playingFrom = 0;  // wall-clock ms the current play started
let playingAt = 0;    // the run's own seconds when it started

const runBar = document.getElementById('run');
const playButton = document.getElementById('play');
const scrub = document.getElementById('scrub');
const clock = document.getElementById('clock');

function secondsOf(i) {
  return ticks.length ? ticks[Math.max(0, Math.min(i, ticks.length - 1))].t : 0;
}

/** One game piece, as a ball of its own size and colour, added to the scene. */
function makeBall(piece) {
  const ball = new THREE.Mesh(
      new THREE.SphereGeometry(piece.radius, 20, 14),
      new THREE.MeshStandardMaterial({ color: new THREE.Color(piece.colour), roughness: 0.55 }));
  ball.castShadow = true;
  ball.userData.radius = piece.radius;
  scene.add(ball);
  return ball;
}

/** The robot, as the simulator collides it: a cube of its size, standing on the floor. */
function makeRobot(size) {
  const group = new THREE.Group();
  const body = new THREE.Mesh(
      new THREE.BoxGeometry(size, size, size),
      new THREE.MeshStandardMaterial({ color: 0x2f6fb5, roughness: 0.45, metalness: 0.1 }));
  body.position.z = size / 2;
  body.castShadow = true;
  group.add(body);

  // An arrow lying on the lid, pointing the way the robot faces. A cube says nothing about its
  // heading on its own, and the heading is half of what a replay is watched for.
  const arrow = new THREE.Group();
  const paint = new THREE.MeshStandardMaterial({ color: 0xffc24a, roughness: 0.5 });
  const shaft = new THREE.Mesh(new THREE.BoxGeometry(size * 0.42, size * 0.12, 0.2), paint);
  shaft.position.set(-size * 0.08, 0, 0);
  const head = new THREE.Mesh(new THREE.ConeGeometry(size * 0.16, size * 0.26, 3), paint);
  head.rotation.z = -Math.PI / 2; // a cone points along its own y; this turns it to point at +x
  head.position.set(size * 0.26, 0, 0);
  arrow.add(shaft);
  arrow.add(head);
  arrow.position.z = size + 0.1; // resting on the lid rather than sunk into it
  group.add(arrow);
  return group;
}

/**
 * A hive leans about the axle it hangs from, which is a turn about the field's y axis through
 * its pivot. The model is exported at the tilt the field is set up at, so what is applied here
 * is the difference from that, and a tick that says nothing leaves the hive where it was.
 */
function leanHive(hive, degrees) {
  const turn = THREE.MathUtils.degToRad(hive.rest - degrees);
  const [px, py, pz] = hive.pivot;
  hive.group.matrixAutoUpdate = false;
  hive.group.matrix
      .makeTranslation(px, py, pz)
      .multiply(new THREE.Matrix4().makeRotationY(turn))
      .multiply(new THREE.Matrix4().makeTranslation(-px, -py, -pz));
  hive.group.updateMatrixWorld(true);
}

async function showRun() {
  const asked = new URLSearchParams(location.search);
  const id = asked.get('run');
  const wantsCamera = asked.get('view') === 'camera';
  if (!field || (!id && !wantsCamera)) {
    return; // the field on its own, which needs nothing more than the model it has drawn
  }
  try {
    model = await fetch('model').then((r) => r.json());
    if (id) {
      const runBody = await fetch('runs/' + encodeURIComponent(id) + '/ticks?from=0').then((r) => r.json());
      ticks = runBody.ticks || [];
    }
  } catch (wrong) {
    problem.textContent = 'The run did not load: ' + (wrong && wrong.message);
    return;
  }
  if (id && !ticks.length) {
    problem.textContent = 'Run ' + id + ' has no loops to play.';
    return;
  }

  moved = model.moved;

  // The CAD's own game pieces stand where the field was set up. A run moves them, so they are
  // drawn here instead and the model's are hidden -- two of each would be worse than none.
  field.traverse((o) => {
    if (o.isMesh && /pollen|nectar/i.test(o.name)) {
      o.visible = false;
    }
  });

  // A tick lists the loose pieces, then the hives' nectar, then the flowers' pollen, and then
  // whatever the robot started out holding. So it is longer than the field's own movable pieces,
  // and the entries past the end are the balls the robot brought with it: null while they are
  // held, and somewhere on the field once they have been launched. A ball with no mesh made for
  // it is a ball that never appears, which is what became of every pollen the robot shot.
  const listed = ticks.reduce(
      (most, tick) => Math.max(most, tick.pieces ? tick.pieces.length : 0), moved.length);
  const spare = moved[0] || { colour: '#ffef3f', radius: 1.4 };
  movingBalls = [];
  for (let i = 0; i < listed; i++) {
    const piece = i < moved.length ? moved[i] : spare;
    const ball = makeBall(piece);
    if (i < moved.length) {
      ball.position.set(piece.centre[0], piece.centre[1], piece.centre[2]);
    } else {
      ball.visible = false; // held, until a tick says otherwise
    }
    movingBalls.push(ball);
  }

  // The ones the simulator never moves: the rows set out beyond the walls, which no tick lists.
  staticBalls = model.pieces
      .filter((piece) => !piece.loose && !piece.cell && !piece.flower)
      .map((piece) => {
        const ball = makeBall(piece);
        ball.position.set(piece.centre[0], piece.centre[1], piece.centre[2]);
        return ball;
      });

  hives = model.hives.map((hive) => ({
    group: field.getObjectByName(nodeNameFor(hive.alliance)),
    pivot: hive.pivot,
    rest: hive.tilt,
    alliance: hive.alliance
  })).filter((h) => h.group);

  robot = makeRobot(model.robotIn || 18);
  scene.add(robot);
  makeTags(new THREE.TextureLoader());
  if (tagsPending === 0) {
    tagsDrawable();
  }
  if (wantsCamera) {
    showCameraView();
  }

  if (ticks.length) {
    scrub.max = String(ticks.length - 1);
    runBar.hidden = false;
    document.title = 'Run ' + id;
    goTo(0);
  } else {
    aimCamera(); // no run: the lens looks from where a robot at the origin would carry it
  }
}

/** The scene node a hive's parts hang under, which the export names for the CAD assembly. */
function nodeNameFor(alliance) {
  let found = null;
  field.traverse((o) => {
    if (!found && !o.isMesh && o.name
        && new RegExp(alliance + '[\\s_-]*Hive', 'i').test(o.name)) {
      found = o.name;
    }
  });
  return found;
}

/** The last tick at or before `upTo` that said where the pieces were. */
function piecesAt(upTo) {
  for (let i = upTo; i >= 0; i--) {
    if (ticks[i].pieces) {
      return ticks[i].pieces;
    }
  }
  return null;
}

function tiltAt(upTo, alliance) {
  const said = ticks[upTo].tilt;
  return said && said[alliance] !== undefined ? said[alliance] : null;
}

function goTo(index) {
  if (!ticks.length) {
    return;
  }
  at = Math.max(0, Math.min(index, ticks.length - 1));
  const tick = ticks[at];

  robot.position.set(tick.x, tick.y, 0);
  robot.rotation.z = tick.heading;

  const where = piecesAt(at);
  if (where) {
    for (let i = 0; i < movingBalls.length; i++) {
      const ball = movingBalls[i];
      const to = where[i];
      if (to) {
        // The camera's view is the tags and nothing else, and a tick that moves a ball must not
        // put it back on screen: what is captured there is meant to be blank but for the tags.
        ball.visible = !cameraView;
        ball.position.set(to[0], to[1], to.length > 2 ? to[2] : ball.userData.radius);
      } else {
        ball.visible = false; // held in the robot, or gone off the field
      }
    }
  }

  for (const hive of hives) {
    const leaning = tiltAt(at, hive.alliance);
    leanHive(hive, leaning === null ? hive.rest : leaning);
  }

  aimCamera();
  scrub.value = String(at);
  const held = tick.held ? ', holding ' + tick.held : '';
  clock.textContent = tick.t.toFixed(2) + ' s  ·  loop ' + (at + 1) + ' of ' + ticks.length + held;
}

playButton.addEventListener('click', () => {
  playing = !playing;
  playButton.textContent = playing ? 'Pause' : 'Play';
  if (playing) {
    if (at >= ticks.length - 1) {
      goTo(0);
    }
    playingFrom = performance.now();
    playingAt = secondsOf(at);
  }
});
scrub.addEventListener('input', () => {
  playing = false;
  playButton.textContent = 'Play';
  goTo(Number(scrub.value));
});
window.addEventListener('keydown', (event) => {
  if (!ticks.length) {
    return;
  }
  if (event.key === ' ') {
    event.preventDefault();
    playButton.click();
  } else if (event.key === 'ArrowRight') {
    playing = false;
    playButton.textContent = 'Play';
    goTo(at + 1);
  } else if (event.key === 'ArrowLeft') {
    playing = false;
    playButton.textContent = 'Play';
    goTo(at - 1);
  }
});

/** Where the run has got to, played in its own time rather than a tick a frame. */
function advance() {
  if (!playing || ticks.length < 2) {
    return;
  }
  const into = playingAt + (performance.now() - playingFrom) / 1000;
  let next = at;
  while (next < ticks.length - 1 && ticks[next + 1].t <= into) {
    next++;
  }
  if (next !== at) {
    goTo(next);
  }
  if (at >= ticks.length - 1) {
    playing = false;
    playButton.textContent = 'Play';
  }
}

renderer.setAnimationLoop(() => {
  advance();
  controls.update();
  renderer.render(scene, cameraView || camera);
});

// --- the camera's view -------------------------------------------------------------------
// `?view=camera` shows what the robot's webcam would see of the goal tags: the tags where they
// are, in the perspective the camera's own lens gives, and nothing else. The field is hidden
// rather than absent, so the tags carry the hives' lean with them as the run plays.
//
// WHAT IS ASSUMED, AND MUST BE MEASURED BEFORE ANY OF IT IS TRUSTED FOR POSE:
//
//   * The lens. teamwebcamcalibrations.xml is still the SDK's stock file -- every <Camera> block
//     in it is commented out -- so these are a plausible 640x480 webcam and not this team's. A
//     detector's range and bearing scale directly with them. Calibrate, then put the real
//     numbers here.
//   * The tag's printed size. The CAD gives a plate 5 in by 17 in; a 36h11 tag's black square is
//     smaller than the plate and the manual is what says by how much. The artwork is fitted to
//     the plate here, preserving its own 3:1 shape, which is a guess at the printing and not a
//     measurement of the tag.
//
// What is not assumed is where the tags are: that comes from the CAD, through the hive they
// hang on, and moves as the hive leans.
const CAMERA = {
  width: 640,
  height: 480,
  fx: 622.0,
  fy: 622.0,
  cx: 320.0,
  cy: 240.0,
  // Where the webcam sits on the robot and which way it looks, from AprilTagWebcam: the FTC
  // convention is +x right, +y forward, +z up, from the middle of the robot at floor height,
  // and a pitch of -90 would be looking level.
  rightIn: 0.75,
  forwardIn: 4,
  upIn: 16,
  pitchDegrees: -68
};

// The four goal tags' artwork, named in full rather than built from the hive and the side: a
// path a page assembles is a path nothing can check, and SimAssetsTest reads these back out to
// hold each one to an asset the bench will actually serve.
const TAG_ARTWORK = {
  blueaudience: 'assets/textures/GoalAprilTag_blueaudience.png',
  bluescoring: 'assets/textures/GoalAprilTag_bluescoring.png',
  redaudience: 'assets/textures/GoalAprilTag_redaudience.png',
  redscoring: 'assets/textures/GoalAprilTag_redscoring.png'
};
let tagQuads = [];
let cameraView = null;
// A quad with no texture yet draws white, which is a tag a detector would never read and a
// frame nobody should keep. Anything capturing frames waits on this.
let tagsPending = 0;
let tagsDrawable = null;
const tagsReady = new Promise((resolve) => { tagsDrawable = resolve; });

/** A pinhole lens as a projection matrix, so a principal point off centre is not quietly lost. */
function lensProjection(lens, near, far) {
  const m = new THREE.Matrix4();
  m.set(
      2 * lens.fx / lens.width, 0, (lens.width - 2 * lens.cx) / lens.width, 0,
      0, 2 * lens.fy / lens.height, -(lens.height - 2 * lens.cy) / lens.height, 0,
      0, 0, -(far + near) / (far - near), -2 * far * near / (far - near),
      0, 0, -1, 0);
  return m;
}

/** A point in the field's frame, in a hive's own, with the hive at the tilt it is exported at. */
function toHive(hive, point) {
  const rest = THREE.MathUtils.degToRad(hive.tilt);
  const c = Math.cos(rest);
  const sn = Math.sin(rest);
  const dx = point.x - hive.pivot[0];
  const dy = point.y - hive.pivot[1];
  const dz = point.z - hive.pivot[2];
  return new THREE.Vector3(dx * c + dz * sn, dy, -dx * sn + dz * c);
}

/**
 * How far down the plate this tag is printed on reaches, in the hive's own frame.
 *
 * Not what field.json says: that is a hull of the points that bound the part, and it comes out
 * thinner than the part really is -- a scoring plate reaches to -1.528 where the hull says
 * -1.500. A quad placed by the hull sits inside the plate that is actually drawn, and the two
 * fight for the same pixels.
 *
 * And not the part's bounding box either. The plate is square to the hive's axes but the hive
 * leans, so a box square to the field's is much bigger than the plate and its lowest corner is
 * most of an inch below the underside. The points themselves are what is asked.
 */
function plateBottom(hive, group, side) {
  let found = null;
  (group || field).traverse((o) => {
    if (o.isMesh && /april[\s_-]*tag/i.test(o.name) && new RegExp(side, 'i').test(o.name)) {
      found = o;
    }
  });
  if (!found) {
    return null;
  }
  const points = found.geometry.attributes.position;
  const point = new THREE.Vector3();
  let lowest = Infinity;
  for (let i = 0; i < points.count; i++) {
    point.fromBufferAttribute(points, i).applyMatrix4(found.matrixWorld);
    lowest = Math.min(lowest, toHive(hive, point).z);
  }
  return lowest;
}

/** A point in a hive's own frame, in the field's, with the hive at the tilt it is exported at. */
function fromHive(hive, point) {
  const rest = THREE.MathUtils.degToRad(hive.tilt);
  const c = Math.cos(rest);
  const sn = Math.sin(rest);
  return new THREE.Vector3(
      hive.pivot[0] + point[0] * c - point[2] * sn,
      hive.pivot[1] + point[1],
      hive.pivot[2] + point[0] * sn + point[2] * c);
}

/**
 * A textured quad over each goal tag's plate, hung under the hive it belongs to so that it leans
 * with it. The plate is given in the hive's own frame, where it is square to the axes: a thin
 * slab, five inches one way and seventeen the other, facing along the hive's z.
 */
function makeTags(loader) {
  for (const hive of model.hives) {
    const group = hives.find((h) => h.alliance === hive.alliance);
    for (const part of hive.parts) {
      if (!/april[\s_-]*tag/i.test(part.name)) {
        continue;
      }
      const side = /scoring/i.test(part.name) ? 'scoring' : 'audience';
      const image = TAG_ARTWORK[hive.alliance.toLowerCase() + side];
      if (!image) {
        problem.textContent = 'No artwork for ' + hive.alliance + ' ' + side + '.';
        continue;
      }
      // The plate in the hive's own frame, where it is square to the axes: thin in z, five
      // inches along x and seventeen along y, lying under the basket's floor and facing down.
      // That is why the robot's camera is pitched up to see it.
      const xs = part.vertices.map((v) => v[0]);
      const ys = part.vertices.map((v) => v[1]);
      const zs = part.vertices.map((v) => v[2]);
      const acrossBeam = Math.max(...ys) - Math.min(...ys);   // 17 in, and the artwork's long way
      const alongBeam = Math.max(...xs) - Math.min(...xs);    // 5 in
      // Below the plate that is drawn, by a hundredth of an inch: enough that nothing rounds
      // the two onto the same pixel, little enough that the artwork still reads as printed on it.
      const drawn = plateBottom(hive, group ? group.group : null, side);
      const under = (drawn === null ? Math.min(...zs) : drawn) - 0.01;

      tagsPending++;
      const texture = loader.load(image, () => {
        if (--tagsPending === 0) {
          tagsDrawable();
        }
      }, undefined, () => {
        problem.textContent = 'The tag artwork ' + image + ' did not load.';
        if (--tagsPending === 0) {
          tagsDrawable();
        }
      });
      texture.colorSpace = THREE.SRGBColorSpace;
      // A tag is nearly always seen at a slant, which is where a texture blurs into grey along
      // one axis and a detector loses its edges. This is the filtering that keeps them.
      texture.anisotropy = renderer.capabilities.getMaxAnisotropy();

      // The artwork is a whole plate of four tags with a labelled band, and it is 3:1 while the
      // plate is 3.4:1. It keeps its own shape and is centred rather than stretched to fill:
      // stretched, the tags stop being square, and a square is what a detector looks for.
      const long = Math.min(acrossBeam, alongBeam * 3);
      const quad = new THREE.Mesh(
          new THREE.PlaneGeometry(long, alongBeam),
          new THREE.MeshBasicMaterial({ map: texture, side: THREE.DoubleSide, toneMapped: false }));

      // Placed by a basis rather than by turns in sequence, which is easy to get subtly wrong and
      // hard to see: the quad's own x is the artwork's long way and lies along the hive's y, its
      // own y lies along the hive's x, and its face looks along the hive's -z, which is down.
      // Face and not back, so the artwork reads the right way round to anything looking up at it;
      // mirrored, a tag is one no detector will ever read.
      const facing = new THREE.Matrix4().makeBasis(
          new THREE.Vector3(0, 1, 0), new THREE.Vector3(1, 0, 0), new THREE.Vector3(0, 0, -1));
      quad.quaternion.setFromRotationMatrix(
          new THREE.Matrix4().makeRotationY(-THREE.MathUtils.degToRad(hive.tilt)).multiply(facing));
      quad.position.copy(fromHive(hive, [
        (Math.max(...xs) + Math.min(...xs)) / 2,
        (Math.max(...ys) + Math.min(...ys)) / 2,
        under
      ]));
      quad.name = 'tag ' + hive.alliance + ' ' + side;
      // Hung under the hive so it leans with it -- which means it is inside the field, and the
      // camera view hides the field. Marked so that it is the one thing not hidden.
      quad.userData.tag = true;
      quad.userData.plate = drawn;
      quad.renderOrder = 2;
      (group ? group.group : scene).add(quad);
      tagQuads.push(quad);
    }
  }
}

/** Everything but the tags hidden, the background black, and the lens the robot's. */
function showCameraView() {
  cameraView = new THREE.PerspectiveCamera();
  cameraView.projectionMatrix.copy(lensProjection(CAMERA, 1, 4000));
  cameraView.projectionMatrixInverse.copy(cameraView.projectionMatrix).invert();
  scene.background = new THREE.Color(0x000000);
  floor.visible = false;
  tiles.visible = false;
  if (field) {
    field.traverse((o) => {
      if (o.isMesh && !o.userData.tag) {
        o.visible = false;
      }
    });
  }
  for (const ball of movingBalls.concat(staticBalls)) {
    ball.visible = false;
  }
  if (robot) {
    robot.visible = false;
  }
  // The page's own furniture stays: this is watched as well as captured, and a run with no way
  // to play or scrub it is one that can only be stared at. What captures frames hides them
  // itself -- see tools/browser/frames.mjs -- since only it knows they must not be in the shot.
  // The lens does not orbit, though, so what the page says about dragging would be a lie.
  document.querySelector('#hud h1').textContent = "The webcam's view";
  said.textContent = 'The goal tags as the robot\u2019s camera would see them. Play and scrub '
      + 'the run; the view follows the robot.';
  aimCamera();
}

/** The camera where the robot's webcam is, looking where it looks. */
function aimCamera() {
  if (!cameraView) {
    return;
  }
  const tick = ticks.length ? ticks[at] : { x: 0, y: 0, heading: 0 };
  const h = tick.heading;
  const forward = new THREE.Vector3(Math.cos(h), Math.sin(h), 0);
  const right = new THREE.Vector3(Math.sin(h), -Math.cos(h), 0);
  cameraView.position.set(
      tick.x + right.x * CAMERA.rightIn + forward.x * CAMERA.forwardIn,
      tick.y + right.y * CAMERA.rightIn + forward.y * CAMERA.forwardIn,
      CAMERA.upIn);
  // A pitch of -90 looks level; anything above that tips the lens up by the difference.
  const up = THREE.MathUtils.degToRad(CAMERA.pitchDegrees + 90);
  const look = new THREE.Vector3(
      forward.x * Math.cos(up), forward.y * Math.cos(up), Math.sin(up));
  cameraView.up.set(0, 0, 1);
  cameraView.lookAt(cameraView.position.clone().add(look));
}

// The page's testing seam. That the model arrived says nothing about whether it was drawn: a
// camera pointed away from the field, or a frustum that culls all of it, leaves a page that has
// loaded everything and rasterises nothing, and the canvas is the background colour either way.
// `drawnTriangles` is what tells those apart; the scene is here so a test can ask which parts
// are in it and how they are drawn, and the camera so it can look somewhere of its choosing.
window.fieldPage = {
  scene: scene,
  camera: camera,
  controls: controls,
  floorZ: FLOOR_Z,
  get loaded() { return loaded; },
  get drawnTriangles() { return renderer.info.render.triangles; },
  get problem() { return problem.textContent; },
  get run() {
    return ticks.length
        ? { loops: ticks.length, at: at, seconds: secondsOf(at), playing: playing,
            robot: robot && { x: robot.position.x, y: robot.position.y, heading: robot.rotation.z },
            balls: movingBalls.length + staticBalls.length,
            launchable: Math.max(0, movingBalls.length - moved.length),
            hives: hives.length }
        : null;
  },
  goTo: (i) => goTo(i),
  /** The first ball past the field's own, which is one the robot brought and can launch. */
  get launchedBall() { return movingBalls.length > moved.length ? movingBalls[moved.length] : null; },
  get camera3() { return cameraView; },
  get tags() { return tagQuads.map((q) => q.name); },
  lens: CAMERA,
  /** Whether each tag was placed against the plate in the scene or fell back to the hull. */
  get tagPlacedAgainstGeometry() {
    return tagQuads.map((quad) => quad.userData.plate !== null && quad.userData.plate !== undefined);
  },
  tagsReady: tagsReady
};
</script>
