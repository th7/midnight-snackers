<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The field</title>
<style>
  :root {
    --bg: #11161c; --panel: #1a222b; --line: #2b3742; --text: #dfe7ee; --dim: #8fa0af;
  }
  @media (prefers-color-scheme: light) {
    :root { --bg: #eef2f5; --panel: #ffffff; --line: #cfd8e0; --text: #1b2430; --dim: #5d6b79; }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--text); overflow: hidden;
    font: 13px/1.5 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  canvas { display: block; touch-action: none; }
  #hud {
    position: fixed; top: 12px; left: 12px; padding: 10px 12px; border-radius: 8px;
    background: color-mix(in srgb, var(--panel) 88%, transparent);
    border: 1px solid var(--line); max-width: min(360px, calc(100vw - 24px));
  }
  #hud h1 { margin: 0 0 4px; font-size: 13px; font-weight: 600; }
  #hud p { margin: 0; color: var(--dim); }
  #hud kbd {
    border: 1px solid var(--line); border-radius: 4px; padding: 0 4px;
    background: var(--bg); font: inherit; font-size: 12px;
  }
  #problem { color: #e06c75; white-space: pre-wrap; }
  #run[hidden] { display: none; }
  #run {
    position: fixed; left: 50%; transform: translateX(-50%); bottom: 14px;
    display: flex; gap: 10px; align-items: center; padding: 8px 12px; border-radius: 10px;
    background: color-mix(in srgb, var(--panel) 92%, transparent);
    border: 1px solid var(--line); width: min(720px, calc(100vw - 24px));
  }
  #run button {
    font: inherit; color: var(--text); background: var(--bg); cursor: pointer;
    border: 1px solid var(--line); border-radius: 6px; padding: 3px 10px; min-width: 62px;
  }
  #scrub { flex: 1; accent-color: #4c8dff; }
  #clock { color: var(--dim); font-variant-numeric: tabular-nums; white-space: nowrap; }
</style>
<script type="importmap">
{
  "imports": {
    "three": "./assets/vendor/three.module.min.js",
    "three/addons/": "./assets/vendor/jsm/"
  }
}
</script>
</head>
<body>
<div id="hud">
  <h1>The field</h1>
  <p id="said">Loading the model&hellip;</p>
  <p id="problem"></p>
</div>
<div id="run" hidden>
  <button id="play" type="button">Play</button>
  <input id="scrub" type="range" min="0" max="0" value="0" step="1" aria-label="loop">
  <span id="clock"></span>
</div>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const said = document.getElementById('said');
const problem = document.getElementById('problem');

THREE.Object3D.DEFAULT_UP.set(0, 0, 1);

const FIELD_IN = 141.17;
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const styles = getComputedStyle(document.documentElement);
scene.background = new THREE.Color(styles.getPropertyValue('--bg').trim() || '#11161c');

const camera = new THREE.PerspectiveCamera(38, 1, 1, 4000);
camera.position.set(-170, -190, 130);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 0, 18);
controls.enableDamping = true;
controls.maxPolarAngle = Math.PI / 2 - 0.02;
controls.minDistance = 30;
controls.maxDistance = 900;

const key = new THREE.DirectionalLight(0xffffff, 2.1);
key.position.set(-120, -160, 260);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
key.shadow.camera.near = 40;
key.shadow.camera.far = 700;
const reach = FIELD_IN * 1.1;
Object.assign(key.shadow.camera, { left: -reach, right: reach, top: reach, bottom: -reach });
key.shadow.bias = -0.0015;
scene.add(key);
scene.add(new THREE.HemisphereLight(0xbfd4e8, 0x2a2f36, 1.0));

const FLOOR_Z = 0;
const TAPE_Z = 0.01;

const SEE_THROUGH = /skin|side[\s_]glass/i;
const floor = new THREE.Mesh(
    new THREE.PlaneGeometry(FIELD_IN, FIELD_IN),
    new THREE.MeshStandardMaterial({ color: 0x20262e, roughness: 0.95, metalness: 0 }));
floor.position.z = FLOOR_Z;
floor.receiveShadow = true;
scene.add(floor);

const tiles = new THREE.GridHelper(FIELD_IN, 6, 0x4a5a68, 0x33414d);
tiles.rotation.x = Math.PI / 2;
tiles.position.z = FLOOR_Z + 0.02;
scene.add(tiles);

function fit() {
  const width = window.innerWidth;
  const height = window.innerHeight;
  renderer.setSize(width, height);
  camera.aspect = width / height;
  camera.updateProjectionMatrix();
}
window.addEventListener('resize', fit);
fit();

let loaded = null;

new GLTFLoader().load('./assets/field.glb', (gltf) => {
  let meshes = 0;
  let triangles = 0;
  gltf.scene.traverse((object) => {
    if (!object.isMesh) {
      return;
    }
    meshes++;
    triangles += object.geometry.index ? object.geometry.index.count / 3
                                       : object.geometry.attributes.position.count / 3;
    object.castShadow = true;
    object.receiveShadow = true;

    if (!object.geometry.attributes.normal) {
      object.geometry.computeVertexNormals();
    }
    object.material.roughness = 0.62;
    object.material.metalness = 0.05;

    if (/tape/i.test(object.name)) {
      object.position.z += TAPE_Z;
    }

    if (SEE_THROUGH.test(object.name)) {
      object.material = object.material.clone();
      object.material.transparent = true;
      object.material.opacity = 0.22;
      object.material.side = THREE.DoubleSide;
      object.material.depthWrite = false;
      object.castShadow = false;
    }
  });
  scene.add(gltf.scene);
  field = gltf.scene;
  loaded = { parts: meshes, triangles: triangles };
  said.textContent = meshes + ' parts, ' + triangles.toLocaleString() + ' triangles. '
      + 'Drag to orbit, scroll to zoom.';
  showRun();
}, undefined, (wrong) => {
  said.textContent = 'The field did not load.';
  problem.textContent = String(wrong && wrong.message ? wrong.message : wrong);
});

let field = null;
let model = null;
let ticks = [];
let moved = [];
let movingBalls = [];
let staticBalls = [];
let hives = [];
let robot = null;
let at = 0;
let playing = false;
let playingFrom = 0;
let playingAt = 0;

const runBar = document.getElementById('run');
const playButton = document.getElementById('play');
const scrub = document.getElementById('scrub');
const clock = document.getElementById('clock');

function secondsOf(i) {
  return ticks.length ? ticks[Math.max(0, Math.min(i, ticks.length - 1))].t : 0;
}

function makeBall(piece) {
  const ball = new THREE.Mesh(
      new THREE.SphereGeometry(piece.radius, 20, 14),
      new THREE.MeshStandardMaterial({ color: new THREE.Color(piece.colour), roughness: 0.55 }));
  ball.castShadow = true;
  ball.userData.radius = piece.radius;
  scene.add(ball);
  return ball;
}

function makeRobot(size) {
  const group = new THREE.Group();
  const body = new THREE.Mesh(
      new THREE.BoxGeometry(size, size, size),
      new THREE.MeshStandardMaterial({ color: 0x2f6fb5, roughness: 0.45, metalness: 0.1 }));
  body.position.z = size / 2;
  body.castShadow = true;
  group.add(body);

  const arrow = new THREE.Group();
  const paint = new THREE.MeshStandardMaterial({ color: 0xffc24a, roughness: 0.5 });
  const shaft = new THREE.Mesh(new THREE.BoxGeometry(size * 0.42, size * 0.12, 0.2), paint);
  shaft.position.set(-size * 0.08, 0, 0);
  const head = new THREE.Mesh(new THREE.ConeGeometry(size * 0.16, size * 0.26, 3), paint);
  head.rotation.z = -Math.PI / 2;
  head.position.set(size * 0.26, 0, 0);
  arrow.add(shaft);
  arrow.add(head);
  arrow.position.z = size + 0.1;
  group.add(arrow);
  return group;
}

function leanHive(hive, degrees) {
  const turn = THREE.MathUtils.degToRad(hive.rest - degrees);
  const [px, py, pz] = hive.pivot;
  hive.group.matrixAutoUpdate = false;
  hive.group.matrix
      .makeTranslation(px, py, pz)
      .multiply(new THREE.Matrix4().makeRotationY(turn))
      .multiply(new THREE.Matrix4().makeTranslation(-px, -py, -pz));
  hive.group.updateMatrixWorld(true);
}

async function showRun() {
  const asked = new URLSearchParams(location.search);
  const id = asked.get('run');
  const wantsCamera = asked.get('view') === 'camera';
  if (!field || (!id && !wantsCamera)) {
    return;
  }
  try {
    model = await fetch('model').then((r) => r.json());
    if (id) {
      const runBody = await fetch('runs/' + encodeURIComponent(id) + '/ticks?from=0').then((r) => r.json());
      ticks = runBody.ticks || [];
    }
  } catch (wrong) {
    problem.textContent = 'The run did not load: ' + (wrong && wrong.message);
    return;
  }
  if (id && !ticks.length) {
    problem.textContent = 'Run ' + id + ' has no loops to play.';
    return;
  }

  moved = model.moved;

  field.traverse((o) => {
    if (o.isMesh && /pollen|nectar/i.test(o.name)) {
      o.visible = false;
    }
  });

  const listed = ticks.reduce(
      (most, tick) => Math.max(most, tick.pieces ? tick.pieces.length : 0), moved.length);
  const spare = moved[0] || { colour: '#ffef3f', radius: 1.4 };
  movingBalls = [];
  for (let i = 0; i < listed; i++) {
    const piece = i < moved.length ? moved[i] : spare;
    const ball = makeBall(piece);
    if (i < moved.length) {
      ball.position.set(piece.centre[0], piece.centre[1], piece.centre[2]);
    } else {
      ball.visible = false;
    }
    movingBalls.push(ball);
  }

  staticBalls = model.pieces
      .filter((piece) => !piece.loose && !piece.cell && !piece.flower)
      .map((piece) => {
        const ball = makeBall(piece);
        ball.position.set(piece.centre[0], piece.centre[1], piece.centre[2]);
        return ball;
      });

  hives = model.hives.map((hive) => ({
    group: field.getObjectByName(nodeNameFor(hive.alliance)),
    pivot: hive.pivot,
    rest: hive.tilt,
    alliance: hive.alliance
  })).filter((h) => h.group);

  robot = makeRobot(model.robotIn || 18);
  scene.add(robot);
  makeTags(new THREE.TextureLoader());
  if (tagsPending === 0) {
    tagsDrawable();
  }
  if (wantsCamera) {
    showCameraView();
  }

  if (ticks.length) {
    scrub.max = String(ticks.length - 1);
    runBar.hidden = false;
    document.title = 'Run ' + id;
    goTo(0);
  } else {
    aimCamera();
  }
}

function nodeNameFor(alliance) {
  let found = null;
  field.traverse((o) => {
    if (!found && !o.isMesh && o.name
        && new RegExp(alliance + '[\\s_-]*Hive', 'i').test(o.name)) {
      found = o.name;
    }
  });
  return found;
}

function piecesAt(upTo) {
  for (let i = upTo; i >= 0; i--) {
    if (ticks[i].pieces) {
      return ticks[i].pieces;
    }
  }
  return null;
}

function tiltAt(upTo, alliance) {
  const said = ticks[upTo].tilt;
  return said && said[alliance] !== undefined ? said[alliance] : null;
}

function goTo(index) {
  if (!ticks.length) {
    return;
  }
  at = Math.max(0, Math.min(index, ticks.length - 1));
  const tick = ticks[at];

  robot.position.set(tick.x, tick.y, 0);
  robot.rotation.z = tick.heading;

  const where = piecesAt(at);
  if (where) {
    for (let i = 0; i < movingBalls.length; i++) {
      const ball = movingBalls[i];
      const to = where[i];
      if (to) {
        ball.visible = !cameraView;
        ball.position.set(to[0], to[1], to.length > 2 ? to[2] : ball.userData.radius);
      } else {
        ball.visible = false;
      }
    }
  }

  for (const hive of hives) {
    const leaning = tiltAt(at, hive.alliance);
    leanHive(hive, leaning === null ? hive.rest : leaning);
  }

  aimCamera();
  scrub.value = String(at);
  const held = tick.held ? ', holding ' + tick.held : '';
  clock.textContent = tick.t.toFixed(2) + ' s  ·  loop ' + (at + 1) + ' of ' + ticks.length + held;
}

playButton.addEventListener('click', () => {
  playing = !playing;
  playButton.textContent = playing ? 'Pause' : 'Play';
  if (playing) {
    if (at >= ticks.length - 1) {
      goTo(0);
    }
    playingFrom = performance.now();
    playingAt = secondsOf(at);
  }
});
scrub.addEventListener('input', () => {
  playing = false;
  playButton.textContent = 'Play';
  goTo(Number(scrub.value));
});
window.addEventListener('keydown', (event) => {
  if (!ticks.length) {
    return;
  }
  if (event.key === ' ') {
    event.preventDefault();
    playButton.click();
  } else if (event.key === 'ArrowRight') {
    playing = false;
    playButton.textContent = 'Play';
    goTo(at + 1);
  } else if (event.key === 'ArrowLeft') {
    playing = false;
    playButton.textContent = 'Play';
    goTo(at - 1);
  }
});

function advance() {
  if (!playing || ticks.length < 2) {
    return;
  }
  const into = playingAt + (performance.now() - playingFrom) / 1000;
  let next = at;
  while (next < ticks.length - 1 && ticks[next + 1].t <= into) {
    next++;
  }
  if (next !== at) {
    goTo(next);
  }
  if (at >= ticks.length - 1) {
    playing = false;
    playButton.textContent = 'Play';
  }
}

renderer.setAnimationLoop(() => {
  advance();
  controls.update();
  renderer.render(scene, cameraView || camera);
});

const CAMERA = {
  width: 640,
  height: 480,
  fx: 622.0,
  fy: 622.0,
  cx: 320.0,
  cy: 240.0,

  rightIn: 0.75,
  forwardIn: 4,
  upIn: 16,
  pitchDegrees: -68
};

const TAG_ARTWORK = {
  blueaudience: 'assets/textures/GoalAprilTag_blueaudience.png',
  bluescoring: 'assets/textures/GoalAprilTag_bluescoring.png',
  redaudience: 'assets/textures/GoalAprilTag_redaudience.png',
  redscoring: 'assets/textures/GoalAprilTag_redscoring.png'
};
let tagQuads = [];
let cameraView = null;

let tagsPending = 0;
let tagsDrawable = null;
const tagsReady = new Promise((resolve) => { tagsDrawable = resolve; });

function lensProjection(lens, near, far) {
  const m = new THREE.Matrix4();
  m.set(
      2 * lens.fx / lens.width, 0, (lens.width - 2 * lens.cx) / lens.width, 0,
      0, 2 * lens.fy / lens.height, -(lens.height - 2 * lens.cy) / lens.height, 0,
      0, 0, -(far + near) / (far - near), -2 * far * near / (far - near),
      0, 0, -1, 0);
  return m;
}

function toHive(hive, point) {
  const rest = THREE.MathUtils.degToRad(hive.tilt);
  const c = Math.cos(rest);
  const sn = Math.sin(rest);
  const dx = point.x - hive.pivot[0];
  const dy = point.y - hive.pivot[1];
  const dz = point.z - hive.pivot[2];
  return new THREE.Vector3(dx * c + dz * sn, dy, -dx * sn + dz * c);
}

function plateBottom(hive, group, side) {
  let found = null;
  (group || field).traverse((o) => {
    if (o.isMesh && /april[\s_-]*tag/i.test(o.name) && new RegExp(side, 'i').test(o.name)) {
      found = o;
    }
  });
  if (!found) {
    return null;
  }
  const points = found.geometry.attributes.position;
  const point = new THREE.Vector3();
  let lowest = Infinity;
  for (let i = 0; i < points.count; i++) {
    point.fromBufferAttribute(points, i).applyMatrix4(found.matrixWorld);
    lowest = Math.min(lowest, toHive(hive, point).z);
  }
  return lowest;
}

function fromHive(hive, point) {
  const rest = THREE.MathUtils.degToRad(hive.tilt);
  const c = Math.cos(rest);
  const sn = Math.sin(rest);
  return new THREE.Vector3(
      hive.pivot[0] + point[0] * c - point[2] * sn,
      hive.pivot[1] + point[1],
      hive.pivot[2] + point[0] * sn + point[2] * c);
}

function makeTags(loader) {
  for (const hive of model.hives) {
    const group = hives.find((h) => h.alliance === hive.alliance);
    for (const part of hive.parts) {
      if (!/april[\s_-]*tag/i.test(part.name)) {
        continue;
      }
      const side = /scoring/i.test(part.name) ? 'scoring' : 'audience';
      const image = TAG_ARTWORK[hive.alliance.toLowerCase() + side];
      if (!image) {
        problem.textContent = 'No artwork for ' + hive.alliance + ' ' + side + '.';
        continue;
      }

      const xs = part.vertices.map((v) => v[0]);
      const ys = part.vertices.map((v) => v[1]);
      const zs = part.vertices.map((v) => v[2]);
      const acrossBeam = Math.max(...ys) - Math.min(...ys);
      const alongBeam = Math.max(...xs) - Math.min(...xs);

      const drawn = plateBottom(hive, group ? group.group : null, side);
      const under = (drawn === null ? Math.min(...zs) : drawn) - 0.01;

      tagsPending++;
      const texture = loader.load(image, () => {
        if (--tagsPending === 0) {
          tagsDrawable();
        }
      }, undefined, () => {
        problem.textContent = 'The tag artwork ' + image + ' did not load.';
        if (--tagsPending === 0) {
          tagsDrawable();
        }
      });
      texture.colorSpace = THREE.SRGBColorSpace;

      texture.anisotropy = renderer.capabilities.getMaxAnisotropy();

      const long = Math.min(acrossBeam, alongBeam * 3);
      const quad = new THREE.Mesh(
          new THREE.PlaneGeometry(long, alongBeam),
          new THREE.MeshBasicMaterial({ map: texture, side: THREE.DoubleSide, toneMapped: false }));

      const facing = new THREE.Matrix4().makeBasis(
          new THREE.Vector3(0, 1, 0), new THREE.Vector3(1, 0, 0), new THREE.Vector3(0, 0, -1));
      quad.quaternion.setFromRotationMatrix(
          new THREE.Matrix4().makeRotationY(-THREE.MathUtils.degToRad(hive.tilt)).multiply(facing));
      quad.position.copy(fromHive(hive, [
        (Math.max(...xs) + Math.min(...xs)) / 2,
        (Math.max(...ys) + Math.min(...ys)) / 2,
        under
      ]));
      quad.name = 'tag ' + hive.alliance + ' ' + side;

      quad.userData.tag = true;
      quad.userData.plate = drawn;
      quad.renderOrder = 2;
      (group ? group.group : scene).add(quad);
      tagQuads.push(quad);
    }
  }
}

function showCameraView() {
  cameraView = new THREE.PerspectiveCamera();
  cameraView.projectionMatrix.copy(lensProjection(CAMERA, 1, 4000));
  cameraView.projectionMatrixInverse.copy(cameraView.projectionMatrix).invert();
  scene.background = new THREE.Color(0x000000);
  floor.visible = false;
  tiles.visible = false;
  if (field) {
    field.traverse((o) => {
      if (o.isMesh && !o.userData.tag) {
        o.visible = false;
      }
    });
  }
  for (const ball of movingBalls.concat(staticBalls)) {
    ball.visible = false;
  }
  if (robot) {
    robot.visible = false;
  }

  document.querySelector('#hud h1').textContent = "The webcam's view";
  said.textContent = 'The goal tags as the robot\u2019s camera would see them. Play and scrub '
      + 'the run; the view follows the robot.';
  aimCamera();
}

function aimCamera() {
  if (!cameraView) {
    return;
  }
  const tick = ticks.length ? ticks[at] : { x: 0, y: 0, heading: 0 };
  const h = tick.heading;
  const forward = new THREE.Vector3(Math.cos(h), Math.sin(h), 0);
  const right = new THREE.Vector3(Math.sin(h), -Math.cos(h), 0);
  cameraView.position.set(
      tick.x + right.x * CAMERA.rightIn + forward.x * CAMERA.forwardIn,
      tick.y + right.y * CAMERA.rightIn + forward.y * CAMERA.forwardIn,
      CAMERA.upIn);

  const up = THREE.MathUtils.degToRad(CAMERA.pitchDegrees + 90);
  const look = new THREE.Vector3(
      forward.x * Math.cos(up), forward.y * Math.cos(up), Math.sin(up));
  cameraView.up.set(0, 0, 1);
  cameraView.lookAt(cameraView.position.clone().add(look));
}

window.fieldPage = {
  scene: scene,
  camera: camera,
  controls: controls,
  floorZ: FLOOR_Z,
  get loaded() { return loaded; },
  get drawnTriangles() { return renderer.info.render.triangles; },
  get problem() { return problem.textContent; },
  get run() {
    return ticks.length
        ? { loops: ticks.length, at: at, seconds: secondsOf(at), playing: playing,
            robot: robot && { x: robot.position.x, y: robot.position.y, heading: robot.rotation.z },
            balls: movingBalls.length + staticBalls.length,
            launchable: Math.max(0, movingBalls.length - moved.length),
            hives: hives.length }
        : null;
  },
  goTo: (i) => goTo(i),

  get launchedBall() { return movingBalls.length > moved.length ? movingBalls[moved.length] : null; },
  get camera3() { return cameraView; },
  get tags() { return tagQuads.map((q) => q.name); },
  lens: CAMERA,

  get tagPlacedAgainstGeometry() {
    return tagQuads.map((quad) => quad.userData.plate !== null && quad.userData.plate !== undefined);
  },
  tagsReady: tagsReady
};
</script>
</body>
</html>
