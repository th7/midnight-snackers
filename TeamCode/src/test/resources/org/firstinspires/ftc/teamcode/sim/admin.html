<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Coding Server Admin</title>
<style>
  :root {
    color-scheme: light;
    --bg: #f4f3ee; --panel: #ffffff; --ink: #1f1d19; --muted: #6e6a61; --line: #d9d6cc; --hover: #f0eee7;
    --accent: #2f5bd7; --accent-ink: #ffffff; --focus: #2f5bd7;
    --ok: #2e7d32; --ok-soft: rgba(46, 125, 50, 0.14); --bad: #c62828; --bad-soft: rgba(198, 40, 40, 0.12);
    --warn: #d84a05; --warn-soft: rgba(216, 74, 5, 0.14);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --bg: #17181b; --panel: #202226; --ink: #ebe9e3; --muted: #9c988f; --line: #35373d; --hover: #26282d;
      --accent: #7ea2ff; --accent-ink: #101318; --focus: #7ea2ff;
      --ok: #7bd389; --ok-soft: rgba(123, 211, 137, 0.16); --bad: #ff8a80; --bad-soft: rgba(255, 138, 128, 0.14);
      --warn: #ff7a3d; --warn-soft: rgba(255, 122, 61, 0.18);
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --bg: #17181b; --panel: #202226; --ink: #ebe9e3; --muted: #9c988f; --line: #35373d; --hover: #26282d;
    --accent: #7ea2ff; --accent-ink: #101318; --focus: #7ea2ff;
    --ok: #7bd389; --ok-soft: rgba(123, 211, 137, 0.16); --bad: #ff8a80; --bad-soft: rgba(255, 138, 128, 0.14);
    --warn: #ff7a3d; --warn-soft: rgba(255, 122, 61, 0.18);
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body { margin: 0; font: 14px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: var(--ink); background: var(--bg); }
  header { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; padding: 16px 20px 0; max-width: 1200px; margin: 0 auto; }
  h1 { font-size: 20px; font-weight: 600; margin: 0; letter-spacing: -0.01em; }
  header .sub { color: var(--muted); margin: 0; }
  main { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 20px; padding: 16px 20px 24px; max-width: 1200px; margin: 0 auto; }
  @media (max-width: 860px) { main { grid-template-columns: 1fr; } }
  .mono { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; font-variant-numeric: tabular-nums; }
  .section-label { font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); margin: 0 0 8px; }
  section { display: grid; gap: 18px; align-content: start; }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; }
  .row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 8px 14px; }
  .row + .row { border-top: 1px solid var(--line); }
  .row .name { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .row .meta { color: var(--muted); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .row.pending { box-shadow: inset 3px 0 0 var(--warn); }
  .actions { display: flex; gap: 6px; }
  .empty { color: var(--muted); padding: 10px 14px; }
  button { font: inherit; padding: 4px 12px; border: 1px solid var(--line); border-radius: 6px; background: var(--panel); color: var(--ink); cursor: pointer; }
  button.primary { background: var(--accent); color: var(--accent-ink); border-color: transparent; font-weight: 600; }
  button.danger { color: var(--bad); }
  button:hover:not(:disabled) { filter: brightness(0.95); }
  button:focus-visible, a:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
  .pill { display: inline-block; padding: 1px 9px; border-radius: 999px; font-size: 12px; font-weight: 600; }
  .pill.ok { color: var(--ok); background: var(--ok-soft); }
  .pill.bad { color: var(--bad); background: var(--bad-soft); }
  .pill.warn { color: var(--warn); background: var(--warn-soft); }
  .pill.muted { color: var(--muted); background: var(--hover); }
  .user + .user { border-top: 1px solid var(--line); }
  .fold { display: inline-flex; align-items: baseline; gap: 6px; max-width: 100%; padding: 0; border: 0; border-radius: 3px; background: none; color: inherit; font: inherit; font-weight: 600; cursor: pointer; }
  .fold:hover { filter: none; text-decoration: underline; }
  .fold .caret { display: inline-block; color: var(--muted); transition: transform 120ms ease; }
  .fold[aria-expanded="true"] .caret { transform: rotate(90deg); }
  .fold .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  @media (prefers-reduced-motion: reduce) { .fold .caret { transition: none; } }
  .sessions { background: var(--bg); border-top: 1px solid var(--line); }
  .sessions .row { padding-left: 30px; }
  .sessions .row .name { font-weight: 500; color: var(--muted); }
  .crumbs { padding: 8px 14px; border-bottom: 1px solid var(--line); color: var(--muted); display: flex; gap: 4px; flex-wrap: wrap; }
  .crumbs a { color: var(--accent); cursor: pointer; text-decoration: none; }
  .crumbs a:hover { text-decoration: underline; }
  #tree .row.dir { cursor: pointer; }
  #tree .row.dir:hover { background: var(--hover); }
  #tree .row.dir .name::before { content: "▸ "; color: var(--muted); }
  .urls { display: grid; gap: 4px; }
  .recipe { grid-column: 1 / -1; margin: 0; padding: 8px 10px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); font-size: 12px; white-space: pre-wrap; overflow-wrap: anywhere; }
  .recipe .why { color: var(--muted); }
  .recipe .why.ok { color: var(--ok); }
  .recipe .why.warn { color: var(--warn); }
  .recipe .why.bad { color: var(--bad); }
  .git { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; margin-top: 4px; font-size: 12px; color: var(--muted); }
  .result { grid-column: 1 / -1; font-size: 12px; color: var(--muted); overflow-wrap: anywhere; }
  .result.ok { color: var(--ok); }
  .result.warn { color: var(--warn); }
  .result.bad { color: var(--bad); }
  button.pull { position: relative; }
  button.pull .badge { display: inline-block; margin-left: 6px; padding: 0 6px; border-radius: 999px; font-size: 11px; font-weight: 600; color: var(--accent-ink); background: var(--accent); }
  button.pull.behind:not(:disabled) { animation: behind 1.6s ease-in-out infinite; }
  @keyframes behind {
    0%, 100% { box-shadow: 0 0 0 0 rgba(47, 91, 215, 0.45); }
    50% { box-shadow: 0 0 0 5px rgba(47, 91, 215, 0); }
  }
  @media (prefers-reduced-motion: reduce) { button.pull.behind:not(:disabled) { animation: none; border-color: var(--accent); } }
</style>
</head>
<body>
<header>
  <h1>Coding server · admin</h1>
  <p class="sub">Only a browser on this machine can open this page.</p>
</header>
<main>
  <section>
    <div>
      <p class="section-label">Tell teammates to open</p>
      <div class="panel"><div id="urls" class="urls mono empty">…</div></div>
    </div>
    <div>
      <p class="section-label">Users</p>
      <div id="users" class="panel"></div>
    </div>
  </section>
  <section>
    <div>
      <p class="section-label">Files teammates can edit</p>
      <div id="editable" class="panel"></div>
    </div>
    <div>
      <p class="section-label">Pick files</p>
      <div class="panel">
        <div id="crumbs" class="crumbs"></div>
        <div id="tree"></div>
      </div>
    </div>
  </section>
</main>
<script>
(function () {
  var usersEl = document.getElementById('users');
  var editableEl = document.getElementById('editable');
  var treeEl = document.getElementById('tree');
  var crumbsEl = document.getElementById('crumbs');
  var urlsEl = document.getElementById('urls');
  var editable = [];
  var dir = '';

  function post(path) {
    return fetch(path, { method: 'POST' });
  }

  function row(cls, name, meta) {
    var el = document.createElement('div');
    el.className = 'row ' + cls;
    el.innerHTML = '<div><div class="name"></div><div class="meta"></div></div><div class="actions"></div>';
    el.querySelector('.name').textContent = name;
    el.querySelector('.meta').textContent = meta;
    return el;
  }

  function button(label, cls, onClick) {
    var b = document.createElement('button');
    b.textContent = label;
    b.className = cls;
    b.addEventListener('click', function (e) { e.stopPropagation(); onClick(); });
    return b;
  }

  function age(seconds) {
    return seconds < 60 ? seconds + 's ago' : Math.floor(seconds / 60) + 'm ago';
  }

  function plural(n, one, many) {
    return n + ' ' + (n === 1 ? one : many);
  }

  function pill(cls, text, title) {
    var el = document.createElement('span');
    el.className = 'pill ' + cls;
    el.textContent = text;
    if (title) { el.title = title; }
    return el;
  }

  /** What the user's worktree holds against its branch and develop: the same status their Edit tab shows. */
  function renderStatus(user) {
    var status = user.status;
    var git = document.createElement('div');
    git.className = 'git';
    if (!status) {
      git.appendChild(pill('bad', 'no status', user.statusError || ''));
      return git;
    }
    var changed = status.changed.length;
    git.appendChild(pill(changed ? 'warn' : 'muted', changed ? plural(changed, 'file', 'files') + ' changed' : 'nothing to commit',
        status.changed.join('\n')));
    git.appendChild(pill(status.ahead ? 'ok' : 'muted', plural(status.ahead, 'commit', 'commits') + ' to push'));
    git.appendChild(pill(status.behind ? 'warn' : 'muted', plural(status.behind, 'commit', 'commits') + ' to pull'));
    return git;
  }

  var stateClass = { pending: 'warn', approved: 'ok', denied: 'bad', revoked: 'muted' };

  /** What the admin's last Pull or Delete for each user said, by username, so a refresh does not wipe it. */
  var resultByUsername = {};
  var pullingByUsername = {};

  /** Whose Delete the server has refused: theirs offers to delete anyway until it is taken back. */
  var deleteArmedByUsername = {};

  /**
   * Which users the admin has opened or closed by hand. Anyone they have not touched is open
   * exactly while a login of theirs is waiting to be decided, so nothing to decide hides in a fold.
   */
  var expandedByUsername = {};

  /** The last listing, so folding one user open redraws without waiting for the next refresh. */
  var lastUsers = [];

  function pendingCount(user) {
    var pending = 0;
    user.sessions.forEach(function (session) {
      if (session.state === 'pending') { pending++; }
    });
    return pending;
  }

  function isExpanded(user) {
    var chosen = expandedByUsername[user.username];
    return chosen === undefined ? pendingCount(user) > 0 : chosen;
  }

  /** A pull is the user's worktree's, and any login of theirs names them to the server: the newest does. */
  function pull(user) {
    var id = user.sessions[user.sessions.length - 1].id;
    pullingByUsername[user.username] = true;
    renderUsers(lastUsers);
    fetch('/admin/logins/' + id + '/pull', { method: 'POST' }).then(function (r) {
      return r.text().then(function (text) { return { ok: r.ok, text: text }; });
    }).catch(function () {
      return { ok: false, text: 'could not reach the server' };
    }).then(function (reply) {
      var result;
      try { result = JSON.parse(reply.text); } catch (e) { result = { message: reply.text }; }
      // How bad it is is the server's answer, not one the page works out again: MergeReport exists
      // because both pages used to derive it from the status code and the outcome name, and
      // disagreed about a push that landed but could not reach origin. A reply that never arrived
      // carries no severity, and that is the one case the page judges for itself.
      resultByUsername[user.username] = {
        text: result.message,
        kind: result.severity === undefined ? 'bad' : result.severity
      };
      delete pullingByUsername[user.username];
      refresh();
    });
  }

  /** What the page remembers about a user, dropped when they are. */
  function forget(username) {
    delete resultByUsername[username];
    delete pullingByUsername[username];
    delete expandedByUsername[username];
    delete deleteArmedByUsername[username];
  }

  /**
   * Delete is the user's: their logins are forgotten, their bench stops and their worktree goes,
   * while their branch keeps everything they committed. The server refuses while they have work
   * develop does not have and says what it is, so the button offers to ask for it anyway rather
   * than the page guessing at a warning of its own.
   */
  function remove(user) {
    var armed = deleteArmedByUsername[user.username];
    var path = '/admin/users/delete?username=' + encodeURIComponent(user.username) + (armed ? '&force=true' : '');
    fetch(path, { method: 'POST' }).then(function (r) {
      return r.text().then(function (text) { return { ok: r.ok, text: text }; });
    }).catch(function () {
      return { ok: false, text: 'could not reach the server' };
    }).then(function (reply) {
      if (reply.ok) {
        forget(user.username);
      } else {
        var result;
        try { result = JSON.parse(reply.text); } catch (e) { result = { message: reply.text }; }
        resultByUsername[user.username] = { text: result.message, kind: 'bad', from: 'delete' };
        deleteArmedByUsername[user.username] = true;
      }
      refresh();
    });
  }

  /** Branch, how many logins, and what any of them has open: what a folded-up user still says. */
  function metaOf(user) {
    var parts = [];
    if (user.branch) { parts.push(user.branch); }
    parts.push(plural(user.sessions.length, 'login', 'logins'));
    var open = [];
    user.sessions.forEach(function (session) {
      if (session.file && open.indexOf(session.file) < 0) { open.push(session.file); }
    });
    if (open.length) { parts.push('editing ' + open.join(', ')); }
    return parts.join(' · ');
  }

  /** One login of one user: where from, how long ago, what it has open, and the admin's decision. */
  function renderSession(user, session) {
    var meta = session.address + ' · ' + age(session.ageSeconds)
        + (session.file ? ' · editing ' + session.file : '');
    var el = row('session ' + session.state, 'login ' + session.id, meta);
    var actions = el.querySelector('.actions');
    actions.appendChild(pill(stateClass[session.state], session.state));
    var path = '/admin/logins/' + session.id;
    function decide(verb, label, cls) {
      return button(label, cls, function () {
        // deciding the last pending login would otherwise fold the user shut under the admin's hand
        expandedByUsername[user.username] = true;
        post(path + verb).then(refresh);
      });
    }
    if (session.state === 'pending') {
      actions.appendChild(decide('/approve', 'Approve', 'primary'));
      actions.appendChild(decide('/deny', 'Deny', 'danger'));
    } else if (session.state === 'approved') {
      actions.appendChild(decide('/revoke', 'Revoke', 'danger'));
    } else {
      actions.appendChild(decide('/approve', 'Approve', ''));
    }
    return el;
  }

  /** One user: their worktree's standing and Pull, with their logins folded under them. */
  function renderUser(user, index) {
    var pending = pendingCount(user);
    var expanded = isExpanded(user);
    var armed = deleteArmedByUsername[user.username];
    if (armed && user.deletable) {
      // the server says a delete would no longer be refused: the loaded button is taken back
      delete deleteArmedByUsername[user.username];
      armed = false;
      if (resultByUsername[user.username] && resultByUsername[user.username].from === 'delete') {
        delete resultByUsername[user.username];
      }
    }
    var listId = 'sessions-' + index;
    var el = document.createElement('div');
    el.className = 'user';

    var head = document.createElement('div');
    head.className = 'row user-head' + (pending ? ' pending' : '');
    var left = document.createElement('div');
    var fold = document.createElement('button');
    fold.className = 'fold';
    fold.type = 'button';
    fold.setAttribute('aria-expanded', expanded ? 'true' : 'false');
    fold.setAttribute('aria-controls', listId);
    fold.innerHTML = '<span class="caret" aria-hidden="true">▸</span><span class="name"></span>';
    fold.querySelector('.name').textContent = user.username;
    fold.addEventListener('click', function () {
      expandedByUsername[user.username] = !expanded;
      delete deleteArmedByUsername[user.username];  // the admin's nearest way to say never mind
      renderUsers(lastUsers);
    });
    left.appendChild(fold);
    var meta = document.createElement('div');
    meta.className = 'meta';
    meta.textContent = metaOf(user);
    if (user.worktree) { meta.title = user.worktree; }
    left.appendChild(meta);
    if (user.worktree) { left.appendChild(renderStatus(user)); }
    head.appendChild(left);
    var actions = document.createElement('div');
    actions.className = 'actions';
    head.appendChild(actions);
    el.appendChild(head);

    if (pending) {
      actions.appendChild(pill('warn', plural(pending, 'login', 'logins') + ' to decide'));
    }
    if (user.worktree) {
      var status = user.status;
      var behind = status ? status.behind : 0;
      var pullButton = button('Pull', 'pull' + (behind > 0 ? ' behind' : ''), function () { pull(user); });
      if (behind > 0) {
        var badge = document.createElement('span');
        badge.className = 'badge';
        badge.textContent = behind;
        pullButton.appendChild(badge);
      }
      if (pullingByUsername[user.username]) {
        pullButton.disabled = true;
        pullButton.title = 'pulling…';
      } else if (!status) {
        pullButton.disabled = true;
        pullButton.title = 'git could not read the worktree';
      } else {
        // uncommitted edits ride along; the pull itself refuses, naming them, only where develop changed the same file
        pullButton.title = behind > 0 ? 'Bring ' + plural(behind, 'commit', 'commits') + ' from develop into ' + user.username + '\'s branch'
            : user.username + '\'s branch has everything on develop';
      }
      actions.appendChild(pullButton);
    }
    var deleteButton = button(armed ? 'Delete anyway' : 'Delete', 'danger', function () { remove(user); });
    deleteButton.title = armed
        ? 'Delete ' + user.username + ' anyway: ' + (user.branch || 'their branch') + ' keeps what they committed'
        : 'Forget ' + user.username + '\'s logins and take their worktree; their branch stays';
    actions.appendChild(deleteButton);

    var result = resultByUsername[user.username];
    if (result) {
      var line = document.createElement('div');
      line.className = 'result ' + result.kind;
      line.textContent = result.text;
      head.appendChild(line);
    }
    var last = user.lastMerge;
    // the commands are git's, so the server writes them; the page prints the lines it is given
    if (last && last.recipe && last.recipe.length) {
      var recipe = document.createElement('pre');
      recipe.className = 'recipe mono';
      var why = document.createElement('div');
      why.className = 'why ' + (last.severity || '');
      why.textContent = last.op + ': ' + last.message;
      recipe.appendChild(why);
      recipe.appendChild(document.createTextNode(last.recipe.join('\n')));
      head.appendChild(recipe);
    }

    var sessions = document.createElement('div');
    sessions.className = 'sessions';
    sessions.id = listId;
    sessions.hidden = !expanded;
    user.sessions.forEach(function (session) {
      sessions.appendChild(renderSession(user, session));
    });
    el.appendChild(sessions);
    return el;
  }

  function renderUsers(users) {
    lastUsers = users;
    usersEl.innerHTML = '';
    if (!users.length) {
      usersEl.innerHTML = '<p class="empty">Nobody has asked to join yet.</p>';
      return;
    }
    users.forEach(function (user, index) {
      usersEl.appendChild(renderUser(user, index));
    });
  }

  function renderEditable() {
    editableEl.innerHTML = '';
    if (!editable.length) {
      editableEl.innerHTML = '<p class="empty">Pick files below. Teammates see nothing until you do.</p>';
      return;
    }
    editable.forEach(function (path) {
      var el = row('', path, '');
      el.querySelector('.actions').appendChild(button('Remove', 'danger', function () {
        post('/admin/files/remove?path=' + encodeURIComponent(path)).then(loadEditable);
      }));
      editableEl.appendChild(el);
    });
  }

  function loadEditable() {
    return fetch('/admin/files').then(function (r) { return r.json(); }).then(function (json) {
      editable = json.files.map(function (f) { return f.path; });
      renderEditable();
      renderTreeButtons();
    });
  }

  var lastTree = null;
  function renderTreeButtons() {
    if (lastTree) { renderTree(lastTree); }
  }

  function renderTree(json) {
    lastTree = json;
    crumbsEl.innerHTML = '';
    var parts = json.dir ? json.dir.split('/') : [];
    var rootLink = document.createElement('a');
    rootLink.textContent = 'project';
    rootLink.addEventListener('click', function () { browse(''); });
    crumbsEl.appendChild(rootLink);
    parts.forEach(function (part, i) {
      crumbsEl.appendChild(document.createTextNode(' / '));
      var link = document.createElement('a');
      link.textContent = part;
      link.addEventListener('click', function () { browse(parts.slice(0, i + 1).join('/')); });
      crumbsEl.appendChild(link);
    });
    treeEl.innerHTML = '';
    json.entries.forEach(function (entry) {
      var el = row(entry.type, entry.name, '');
      if (entry.type === 'dir') {
        el.addEventListener('click', function () { browse(entry.path); });
      } else if (editable.indexOf(entry.path) >= 0) {
        var pill = document.createElement('span');
        pill.className = 'pill ok';
        pill.textContent = 'editable';
        el.querySelector('.actions').appendChild(pill);
      } else {
        el.querySelector('.actions').appendChild(button('Add', '', function () {
          post('/admin/files/add?path=' + encodeURIComponent(entry.path)).then(function (r) {
            if (!r.ok) { return r.text().then(alert); }
            return loadEditable();
          });
        }));
      }
      treeEl.appendChild(el);
    });
  }

  function browse(path) {
    dir = path;
    fetch('/admin/tree?dir=' + encodeURIComponent(dir)).then(function (r) {
      if (!r.ok) { return r.text().then(function (t) { treeEl.innerHTML = '<p class="empty"></p>'; treeEl.firstChild.textContent = t; }); }
      return r.json().then(renderTree);
    });
  }

  function refresh() {
    fetch('/admin/users').then(function (r) { return r.json(); }).then(function (json) { renderUsers(json.users); }).catch(function () {});
  }

  fetch('/admin/info').then(function (r) { return r.json(); }).then(function (info) {
    urlsEl.className = 'urls mono';
    urlsEl.innerHTML = '';
    if (!info.addresses.length) {
      urlsEl.textContent = 'http://<this machine\'s LAN address>:' + info.userPort + '/';
    }
    info.addresses.forEach(function (address) {
      var line = document.createElement('div');
      line.textContent = 'http://' + address + ':' + info.userPort + '/';
      urlsEl.appendChild(line);
    });
  });
  loadEditable().then(function () { browse(''); });
  refresh();
  setInterval(refresh, 2000);  // each listing asks git about every worktree, as the Edit tab does at this pace
})();
</script>
</body>
</html>
