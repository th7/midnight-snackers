<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Robot Gateway Admin</title>
<style>
  :root {
    color-scheme: light;
    --bg: #f4f3ee; --panel: #ffffff; --ink: #1f1d19; --muted: #6e6a61; --line: #d9d6cc; --hover: #f0eee7;
    --accent: #2f5bd7; --accent-ink: #ffffff; --focus: #2f5bd7;
    --ok: #2e7d32; --ok-soft: rgba(46, 125, 50, 0.14); --bad: #c62828; --bad-soft: rgba(198, 40, 40, 0.12);
    --warn: #d84a05; --warn-soft: rgba(216, 74, 5, 0.14);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --bg: #17181b; --panel: #202226; --ink: #ebe9e3; --muted: #9c988f; --line: #35373d; --hover: #26282d;
      --accent: #7ea2ff; --accent-ink: #101318; --focus: #7ea2ff;
      --ok: #7bd389; --ok-soft: rgba(123, 211, 137, 0.16); --bad: #ff8a80; --bad-soft: rgba(255, 138, 128, 0.14);
      --warn: #ff7a3d; --warn-soft: rgba(255, 122, 61, 0.18);
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --bg: #17181b; --panel: #202226; --ink: #ebe9e3; --muted: #9c988f; --line: #35373d; --hover: #26282d;
    --accent: #7ea2ff; --accent-ink: #101318; --focus: #7ea2ff;
    --ok: #7bd389; --ok-soft: rgba(123, 211, 137, 0.16); --bad: #ff8a80; --bad-soft: rgba(255, 138, 128, 0.14);
    --warn: #ff7a3d; --warn-soft: rgba(255, 122, 61, 0.18);
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body { margin: 0; font: 14px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: var(--ink); background: var(--bg); }
  header { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; padding: 16px 20px 0; max-width: 1200px; margin: 0 auto; }
  h1 { font-size: 20px; font-weight: 600; margin: 0; letter-spacing: -0.01em; }
  header .sub { color: var(--muted); margin: 0; }
  main { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr); gap: 20px; padding: 16px 20px 24px; max-width: 1200px; margin: 0 auto; }
  @media (max-width: 860px) { main { grid-template-columns: 1fr; } }
  .mono { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; font-variant-numeric: tabular-nums; }
  .section-label { font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); margin: 0 0 8px; }
  section { display: grid; gap: 18px; align-content: start; }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; }
  .row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 8px 14px; }
  .row + .row { border-top: 1px solid var(--line); }
  .row .name { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .row .meta { color: var(--muted); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .row.pending { box-shadow: inset 3px 0 0 var(--warn); }
  .actions { display: flex; gap: 6px; }
  .empty { color: var(--muted); padding: 10px 14px; }
  button { font: inherit; padding: 4px 12px; border: 1px solid var(--line); border-radius: 6px; background: var(--panel); color: var(--ink); cursor: pointer; }
  button.primary { background: var(--accent); color: var(--accent-ink); border-color: transparent; font-weight: 600; }
  button.danger { color: var(--bad); }
  button:hover:not(:disabled) { filter: brightness(0.95); }
  button:focus-visible, a:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
  .pill { display: inline-block; padding: 1px 9px; border-radius: 999px; font-size: 12px; font-weight: 600; }
  .pill.ok { color: var(--ok); background: var(--ok-soft); }
  .pill.bad { color: var(--bad); background: var(--bad-soft); }
  .pill.warn { color: var(--warn); background: var(--warn-soft); }
  .pill.muted { color: var(--muted); background: var(--hover); }
  .user + .user { border-top: 1px solid var(--line); }
  .fold { display: inline-flex; align-items: baseline; gap: 6px; max-width: 100%; padding: 0; border: 0; border-radius: 3px; background: none; color: inherit; font: inherit; font-weight: 600; cursor: pointer; }
  .fold:hover { filter: none; text-decoration: underline; }
  .fold .caret { display: inline-block; color: var(--muted); transition: transform 120ms ease; }
  .fold[aria-expanded="true"] .caret { transform: rotate(90deg); }
  .fold .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  @media (prefers-reduced-motion: reduce) { .fold .caret { transition: none; } }
  .sessions { background: var(--bg); border-top: 1px solid var(--line); }
  .sessions .row { padding-left: 30px; }
  .sessions .row .name { font-weight: 500; color: var(--muted); }
  .urls { display: grid; gap: 4px; }
  .result { grid-column: 1 / -1; font-size: 12px; color: var(--muted); overflow-wrap: anywhere; }
  .result.ok { color: var(--ok); }
  .result.warn { color: var(--warn); }
  .result.bad { color: var(--bad); }
  @media (max-width: 520px) {
    .row.user-head { grid-template-columns: minmax(0, 1fr); }
    .row.user-head .actions { flex-wrap: wrap; }
  }
  .models { display: grid; gap: 10px; padding: 12px 14px; }
  .models p { margin: 0; }
  .models label { display: flex; align-items: center; gap: 8px; color: var(--muted); }
  .models select { font: inherit; padding: 2px 6px; border: 1px solid var(--line); border-radius: 6px; background: var(--panel); color: var(--ink); }
  .models .buttons { display: flex; flex-wrap: wrap; gap: 8px; }
  #assets-said { color: var(--muted); font-size: 12px; overflow-wrap: anywhere; }
</style>
</head>
<body>
<header>
  <h1>Robot gateway · admin</h1>
  <p class="sub">Only a browser on this machine can open this page.</p>
</header>
<main>
  <section>
    <div>
      <p class="section-label">Users</p>
      <div id="users" class="panel"></div>
    </div>
  </section>
  <section>
    <div>
      <p class="section-label">Tell teammates to open</p>
      <div class="panel"><div id="urls" class="urls mono empty">…</div></div>
    </div>
    <div>
      <p class="section-label">Robot relay</p>
      <div id="relay" class="panel"><p class="empty">…</p></div>
    </div>
    <div>
      <p class="section-label">Field models</p>
      <div class="panel models">
        <p id="assets-state">&hellip;</p>
        <label title="Which one the buttons below build">Build
          <select id="assets-resolution">
            <option value="low">low (4 MB)</option>
            <option value="medium">medium (28 MB)</option>
            <option value="high" selected>high (42 MB)</option>
            <option value="all">all three</option>
          </select>
        </label>
        <div class="buttons">
          <button id="download-assets" type="button" title="Fetch the assembly and the textures from Onshape and keep them">Download</button>
          <button id="build-assets" type="button" title="Build the models from the export already downloaded; no Onshape, under a second">Build</button>
          <button id="refresh-assets" type="button" title="Download and then build, in one">Refresh assets</button>
        </div>
        <p id="assets-said" class="mono"></p>
      </div>
    </div>
  </section>
</main>
<script>
(function () {
  var assetsState = document.getElementById('assets-state');
  var assetsSaid = document.getElementById('assets-said');
  var refreshAssets = document.getElementById('refresh-assets');
  var downloadAssets = document.getElementById('download-assets');
  var buildAssets = document.getElementById('build-assets');
  var assetsResolution = document.getElementById('assets-resolution');
  var buttons = [downloadAssets, buildAssets, refreshAssets];

  function showAssets(json) {
    assetsState.textContent = json.complete
      ? 'The field models are fetched from Onshape.'
      : 'The field models have not been fetched from Onshape yet.';
    var names = Object.keys(json.fetched || {});
    var resolution = json.resolution || {};
    var held = Object.keys(resolution).filter(function (name) { return resolution[name]; });
    assetsSaid.textContent = (names.length
      ? names.length + ' fetched, in ' + json.under
      : 'nothing fetched, so ' + json.under + ' is empty')
      + (held.length ? '. Models held: ' + held.join(', ') + '.' : '.')
      + (json.downloaded ? ' The export is here, so Build needs no Onshape.' : ' Nothing downloaded to build from.');
    buildAssets.disabled = !json.downloaded;
  }

  function loadAssets() {
    return fetch('/admin/assets').then(function (r) { return r.json(); }).then(showAssets)
      .catch(function () { assetsState.textContent = 'The admin server did not answer about the assets.'; });
  }

  function ask(where, saying, failed) {
    buttons.forEach(function (button) { button.disabled = true; });
    assetsSaid.textContent = saying;
    fetch(where, { method: 'POST' }).then(function (r) {
      return r.text().then(function (text) { return { ok: r.ok, text: text }; });
    }).then(function (answer) {
      if (!answer.ok) {
        assetsSaid.textContent = answer.text;
        return;
      }
      showAssets(JSON.parse(answer.text));
    }).catch(function (wrong) {
      assetsSaid.textContent = failed + ': ' + wrong;
    }).then(function () {
      buttons.forEach(function (button) { button.disabled = false; });
      loadAssets();
    });
  }

  function resolution() {
    return '?resolution=' + encodeURIComponent(assetsResolution.value);
  }

  downloadAssets.addEventListener('click', function () {
    ask('/admin/assets/download', 'Fetching from Onshape\u2026 the export is about eleven megabytes.',
        'The download did not finish');
  });

  buildAssets.addEventListener('click', function () {
    ask('/admin/assets/build' + resolution(), 'Building from the export already here\u2026',
        'The build did not finish');
  });

  refreshAssets.addEventListener('click', function () {
    ask('/admin/assets/refresh' + resolution(), 'Fetching from Onshape\u2026 the model is a few megabytes.',
        'The refresh did not finish');
  });

  loadAssets();

  var usersEl = document.getElementById('users');
  var urlsEl = document.getElementById('urls');
  var relayEl = document.getElementById('relay');
  function keyOf(user) {
    return user.username;
  }

  function post(path) {
    return fetch(path, { method: 'POST' });
  }

  function answered(r) {
    return r.text().then(function (text) { return { ok: r.ok, text: text }; });
  }

  function unreachable() {
    return { ok: false, text: 'could not reach the server' };
  }

  function messageOf(reply) {
    try { return JSON.parse(reply.text).message || reply.text; } catch (e) { return reply.text; }
  }

  function row(cls, name, meta) {
    var el = document.createElement('div');
    el.className = 'row ' + cls;
    el.innerHTML = '<div><div class="name"></div><div class="meta"></div></div><div class="actions"></div>';
    el.querySelector('.name').textContent = name;
    el.querySelector('.meta').textContent = meta;
    return el;
  }

  function button(label, cls, onClick) {
    var b = document.createElement('button');
    b.textContent = label;
    b.className = cls;
    b.addEventListener('click', function (e) { e.stopPropagation(); onClick(); });
    return b;
  }

  function age(seconds) {
    return seconds < 60 ? seconds + 's ago' : Math.floor(seconds / 60) + 'm ago';
  }

  function plural(n, one, many) {
    return n + ' ' + (n === 1 ? one : many);
  }

  function pill(cls, text, title) {
    var el = document.createElement('span');
    el.className = 'pill ' + cls;
    el.textContent = text;
    if (title) { el.title = title; }
    return el;
  }

  var stateClass = { pending: 'warn', approved: 'ok', denied: 'bad', revoked: 'muted' };

  var resultByUsername = {};

  var expandedByUsername = {};

  var lastUsers = [];

  function pendingCount(user) {
    var pending = 0;
    user.sessions.forEach(function (session) {
      if (session.state === 'pending') { pending++; }
    });
    return pending;
  }

  function isExpanded(user) {
    var chosen = expandedByUsername[keyOf(user)];
    return chosen === undefined ? pendingCount(user) > 0 : chosen;
  }

  function forget(user) {
    delete resultByUsername[keyOf(user)];
    delete expandedByUsername[keyOf(user)];
  }

  function remove(user) {
    post('/admin/users/delete?username=' + encodeURIComponent(user.username)).then(answered).catch(unreachable).then(function (reply) {
      if (reply.ok) {
        forget(user);
      } else {
        resultByUsername[keyOf(user)] = { text: messageOf(reply), kind: 'bad' };
      }
      refresh();
    });
  }

  function metaOf(user) {
    var approved = user.sessions.some(function (session) { return session.state === 'approved'; });
    return (approved ? 'in' : 'not in') + ' · ' + plural(user.sessions.length, 'login', 'logins');
  }

  function renderSession(user, session) {
    var meta = session.address + ' · ' + age(session.ageSeconds);
    var el = row('session ' + session.state, 'login ' + session.id, meta);
    var actions = el.querySelector('.actions');
    actions.appendChild(pill(stateClass[session.state], session.state));
    var path = '/admin/logins/' + session.id;
    function decide(verb, label, cls, title) {
      var b = button(label, cls, function () {
        expandedByUsername[keyOf(user)] = true;
        post(path + verb).then(refresh);
      });
      if (title) { b.title = title; }
      return b;
    }
    var letIn = 'Let this login in: adb from ' + session.address + ' then reaches the robot';
    if (session.state === 'pending') {
      actions.appendChild(decide('/approve', 'Approve', 'primary', letIn));
      actions.appendChild(decide('/deny', 'Deny', 'danger'));
    } else if (session.state === 'approved') {
      actions.appendChild(decide('/revoke', 'Revoke', 'danger'));
    } else {
      actions.appendChild(decide('/approve', 'Approve', '', letIn));
    }
    return el;
  }

  function renderUser(user, index) {
    var pending = pendingCount(user);
    var expanded = isExpanded(user);
    var listId = 'sessions-' + index;
    var el = document.createElement('div');
    el.className = 'user';

    var head = document.createElement('div');
    head.className = 'row user-head' + (pending ? ' pending' : '');
    var left = document.createElement('div');
    var fold = document.createElement('button');
    fold.className = 'fold';
    fold.type = 'button';
    fold.setAttribute('aria-expanded', expanded ? 'true' : 'false');
    fold.setAttribute('aria-controls', listId);
    fold.innerHTML = '<span class="caret" aria-hidden="true">▸</span><span class="name"></span>';
    fold.querySelector('.name').textContent = user.username;
    fold.addEventListener('click', function () {
      expandedByUsername[keyOf(user)] = !expanded;
      renderUsers(lastUsers);
    });
    left.appendChild(fold);
    var meta = document.createElement('div');
    meta.className = 'meta';
    meta.textContent = metaOf(user);
    left.appendChild(meta);
    head.appendChild(left);
    var actions = document.createElement('div');
    actions.className = 'actions';
    head.appendChild(actions);
    el.appendChild(head);

    if (pending) {
      actions.appendChild(pill('warn', plural(pending, 'login', 'logins') + ' to decide'));
    }
    if (user.relayed) {
      actions.appendChild(pill('ok', 'relaying', 'An adb connection from where their approved login came from is open to the robot'));
    }
    var deleteButton = button('Delete', 'danger', function () { remove(user); });
    deleteButton.title = 'Forget every login of ' + user.username + ' and close their adb connections';
    actions.appendChild(deleteButton);

    var result = resultByUsername[keyOf(user)];
    if (result) {
      var line = document.createElement('div');
      line.className = 'result ' + result.kind;
      line.textContent = result.text;
      head.appendChild(line);
    }

    var sessions = document.createElement('div');
    sessions.className = 'sessions';
    sessions.id = listId;
    sessions.hidden = !expanded;
    user.sessions.forEach(function (session) {
      sessions.appendChild(renderSession(user, session));
    });
    el.appendChild(sessions);
    return el;
  }

  function renderUsers(users) {
    lastUsers = users;
    usersEl.innerHTML = '';
    if (!users.length) {
      usersEl.innerHTML = '<p class="empty">Nobody has asked to join yet.</p>';
      return;
    }
    users.forEach(function (user, index) {
      usersEl.appendChild(renderUser(user, index));
    });
  }

  var hubStateClass = { reachable: 'ok', unreachable: 'bad', untried: 'muted' };
  var hubStateText = { reachable: 'reachable', unreachable: 'unreachable', untried: 'not tried yet' };

  function renderRelay(relay) {
    relayEl.innerHTML = '';
    if (!relay) { return; }
    var hub = row('hub', 'Hub at ' + relay.hub, '');
    var checked = relay.hubCheckedSecondsAgo === null ? '' : 'checked ' + age(relay.hubCheckedSecondsAgo);
    hub.querySelector('.meta').textContent = relay.hubWhy ? relay.hubWhy + (checked ? ' · ' + checked : '') : checked;
    hub.querySelector('.actions').appendChild(pill(hubStateClass[relay.hubState] || 'muted',
        hubStateText[relay.hubState] || relay.hubState,
        'Whether this machine could open a connection to the hub\'s adb port when it last tried'));
    relayEl.appendChild(hub);
    var told = row('told', 'Approved teammates run', '');
    told.querySelector('.meta').className = 'meta mono';
    told.querySelector('.meta').textContent = relay.connect.join('   or   ');
    relayEl.appendChild(told);
  }

  function refresh() {
    fetch('/admin/users').then(function (r) { return r.json(); }).then(function (json) {
      renderUsers(json.users);
      renderRelay(json.relay);
    }).catch(function () {});
  }

  fetch('/admin/info').then(function (r) { return r.json(); }).then(function (info) {
    urlsEl.className = 'urls mono';
    urlsEl.innerHTML = '';
    if (!info.addresses.length) {
      urlsEl.textContent = 'http://<this machine\'s LAN address>:' + info.userPort + '/';
    }
    info.addresses.forEach(function (address) {
      var line = document.createElement('div');
      line.textContent = 'http://' + address + ':' + info.userPort + '/';
      urlsEl.appendChild(line);
    });
  }).catch(function () {});
  refresh();
  setInterval(refresh, 2000);
})();
</script>
</body>
</html>
