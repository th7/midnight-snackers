<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sim Bench</title>
<style>
  :root {
    color-scheme: light;
    --bg: #f4f3ee; --panel: #ffffff; --ink: #1f1d19; --muted: #6e6a61; --line: #d9d6cc; --hover: #f0eee7;
    --accent: #2f5bd7; --accent-ink: #ffffff; --focus: #2f5bd7;
    --ok: #2e7d32; --ok-soft: rgba(46, 125, 50, 0.14); --bad: #c62828; --bad-soft: rgba(198, 40, 40, 0.12);
    --live: #d84a05; --live-soft: rgba(216, 74, 5, 0.14);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --bg: #17181b; --panel: #202226; --ink: #ebe9e3; --muted: #9c988f; --line: #35373d; --hover: #26282d;
      --accent: #7ea2ff; --accent-ink: #101318; --focus: #7ea2ff;
      --ok: #7bd389; --ok-soft: rgba(123, 211, 137, 0.16); --bad: #ff8a80; --bad-soft: rgba(255, 138, 128, 0.14);
      --live: #ff7a3d; --live-soft: rgba(255, 122, 61, 0.18);
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --bg: #17181b; --panel: #202226; --ink: #ebe9e3; --muted: #9c988f; --line: #35373d; --hover: #26282d;
    --accent: #7ea2ff; --accent-ink: #101318; --focus: #7ea2ff;
    --ok: #7bd389; --ok-soft: rgba(123, 211, 137, 0.16); --bad: #ff8a80; --bad-soft: rgba(255, 138, 128, 0.14);
    --live: #ff7a3d; --live-soft: rgba(255, 122, 61, 0.18);
  }
  * { box-sizing: border-box; }
  body { margin: 0; font: 14px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: var(--ink); background: var(--bg); }
  header { display: flex; align-items: baseline; gap: 14px; padding: 16px 20px 0; max-width: 1400px; margin: 0 auto; }
  h1 { font-size: 20px; font-weight: 600; margin: 0; letter-spacing: -0.01em; }
  header .sub { color: var(--muted); margin: 0; }
  main { display: grid; grid-template-columns: 300px minmax(0, 1fr); gap: 20px; padding: 16px 20px 24px; max-width: 1400px; margin: 0 auto; }
  @media (max-width: 900px) { main { grid-template-columns: 1fr; } }
  .mono { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; font-variant-numeric: tabular-nums; }
  .section-label { font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); margin: 0 0 8px; }
  aside { align-self: start; display: grid; gap: 18px; }
  .opmodes { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 6px 0; }
  .opmode { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 8px 14px; }
  .opmode + .opmode { border-top: 1px solid var(--line); }
  .opmode .name { font-weight: 600; }
  .opmode .cls { color: var(--muted); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .group-label { padding: 8px 14px 2px; color: var(--muted); font-size: 12px; letter-spacing: 0.06em; text-transform: uppercase; }
  button { font: inherit; padding: 6px 14px; border: 1px solid var(--line); border-radius: 6px; background: var(--panel); color: var(--ink); cursor: pointer; }
  button.run { background: var(--accent); color: var(--accent-ink); border-color: transparent; font-weight: 600; }
  button:hover:not(:disabled) { filter: brightness(0.95); }
  button:disabled { opacity: 0.45; cursor: default; }
  button:focus-visible, a:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
  .stage { display: grid; gap: 14px; min-width: 0; }
  .stage-head { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; min-height: 32px; }
  .stage-head h2 { font-size: 16px; font-weight: 600; margin: 0; }
  iframe { width: 100%; height: 1080px; border: 1px solid var(--line); border-radius: 6px; background: var(--panel); display: block; }
  .empty { border: 1px dashed var(--line); border-radius: 6px; padding: 48px 20px; text-align: center; color: var(--muted); }
  .pill { display: inline-block; padding: 1px 9px; border-radius: 999px; font-size: 12px; font-weight: 600; }
  .pill.ok { color: var(--ok); background: var(--ok-soft); }
  .pill.bad { color: var(--bad); background: var(--bad-soft); }
  .pill.live { color: var(--live); background: var(--live-soft); }
  .pill.live::before { content: ""; display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--live); margin-right: 6px; vertical-align: 1px; }
  table { border-collapse: collapse; width: 100%; background: var(--panel); border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
  th, td { text-align: left; padding: 7px 12px; border-top: 1px solid var(--line); vertical-align: middle; }
  th { border-top: 0; color: var(--muted); font-weight: 500; font-size: 12px; letter-spacing: 0.04em; text-transform: uppercase; }
  td.num { text-align: right; }
  tr.current td { background: var(--hover); }
  a { color: var(--accent); }
  .msg { color: var(--bad); min-height: 1.4em; margin: 0; }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<header>
  <h1>Sim Bench</h1>
  <p class="sub">Run an autonomous op mode on the simulated robot and watch it drive. One run at a time, in real time.</p>
</header>
<main>
  <aside>
    <div>
      <p class="section-label">Autonomous op modes</p>
      <div class="opmodes" id="opmodes"></div>
      <p class="msg" id="msg" role="status"></p>
    </div>
    <div>
      <p class="section-label">Runs</p>
      <table id="history">
        <thead><tr><th>#</th><th>Op mode</th><th>Outcome</th><th class="num">Loops</th><th class="num">s</th><th></th></tr></thead>
        <tbody></tbody>
      </table>
    </div>
  </aside>
  <section class="stage">
    <div class="stage-head">
      <h2 id="stage-title">No run yet</h2>
      <span id="stage-state"></span>
    </div>
    <div class="empty" id="stage-empty">Pick an op mode and press Run. The live view appears here.</div>
    <iframe id="stage" title="Live view of the current run" hidden></iframe>
  </section>
</main>
<script id="catalog" type="application/json">__CATALOG__</script>
<script>
(function () {
  const catalog = JSON.parse(document.getElementById('catalog').textContent);
  const list = document.getElementById('opmodes');
  const msg = document.getElementById('msg');
  const stage = document.getElementById('stage');
  const stageEmpty = document.getElementById('stage-empty');
  const stageTitle = document.getElementById('stage-title');
  const stageState = document.getElementById('stage-state');
  const history = document.querySelector('#history tbody');
  let shownRunId = null;
  let running = false;

  function renderCatalog() {
    let lastGroup = null;
    list.innerHTML = '';
    if (!catalog.length) {
      list.innerHTML = '<div class="opmode"><span class="cls">No autonomous op modes found.</span></div>';
    }
    for (const entry of catalog) {
      if (entry.group !== lastGroup) {
        const label = document.createElement('div');
        label.className = 'group-label';
        label.textContent = entry.group || 'ungrouped';
        list.appendChild(label);
        lastGroup = entry.group;
      }
      const row = document.createElement('div');
      row.className = 'opmode';
      const text = document.createElement('div');
      const name = document.createElement('div'); name.className = 'name'; name.textContent = entry.name;
      const cls = document.createElement('div'); cls.className = 'cls mono'; cls.textContent = entry.opMode; cls.title = entry.opMode;
      text.append(name, cls);
      const button = document.createElement('button');
      button.className = 'run'; button.textContent = 'Run'; button.dataset.opmode = entry.opMode;
      button.addEventListener('click', () => run(entry));
      row.append(text, button);
      list.appendChild(row);
    }
  }

  async function run(entry) {
    msg.textContent = '';
    try {
      const response = await fetch('/run?opmode=' + encodeURIComponent(entry.opMode), { method: 'POST' });
      if (!response.ok) { msg.textContent = 'Could not start ' + entry.name + ': ' + (await response.text()); return; }
      const started = await response.json();
      show(started.id, entry.name);
      poll();
    } catch (e) {
      msg.textContent = 'Lost the bench process: ' + e;
    }
  }

  function show(id, name) {
    if (shownRunId === id) return;
    shownRunId = id;
    stageTitle.textContent = 'Run ' + id + ': ' + name;
    stageEmpty.hidden = true;
    stage.hidden = false;
    stage.src = '/runs/' + id + '/';
  }

  function pill(run) {
    if (!run.outcome) return '<span class="pill live">running</span>';
    const ok = run.outcome === 'done';
    return '<span class="pill ' + (ok ? 'ok' : 'bad') + '">' + escapeHtml(run.outcome) + '</span>';
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  }

  function renderStatus(status) {
    running = status.running;
    for (const button of list.querySelectorAll('button.run')) button.disabled = running;
    history.innerHTML = status.runs.map(run =>
      '<tr class="' + (run.id === shownRunId ? 'current' : '') + '">' +
      '<td class="mono">' + run.id + '</td>' +
      '<td>' + escapeHtml(run.name) + '</td>' +
      '<td>' + pill(run) + '</td>' +
      '<td class="num mono">' + run.loops + '</td>' +
      '<td class="num mono">' + run.seconds.toFixed(1) + '</td>' +
      '<td><a href="/runs/' + run.id + '/" data-id="' + run.id + '" data-name="' + escapeHtml(run.name) + '">show</a></td>' +
      '</tr>').join('');
    for (const link of history.querySelectorAll('a[data-id]')) {
      link.addEventListener('click', e => { e.preventDefault(); show(parseInt(link.dataset.id, 10), link.dataset.name); renderStatus(status); });
    }
    const shown = status.runs.find(r => r.id === shownRunId);
    stageState.innerHTML = shown ? pill(shown) : '';
    if (status.runs.length && shownRunId === null) show(status.runs[0].id, status.runs[0].name);
  }

  let pollTimer = null;
  async function poll() {
    clearTimeout(pollTimer);
    try {
      const response = await fetch('/status', { cache: 'no-store' });
      renderStatus(await response.json());
      msg.textContent = msg.textContent.startsWith('Lost') ? '' : msg.textContent;
    } catch (e) {
      msg.textContent = 'Lost the bench process. Restart it with ./gradlew :TeamCode:simDev';
    }
    pollTimer = setTimeout(poll, running ? 500 : 2000);
  }

  renderCatalog();
  poll();
})();
</script>
</body>
</html>
