apply plugin: 'com.android.application'
apply plugin: 'com.diffplug.spotless'

//
// build.gradle in TeamCode
//
// Most of the definitions for building your module reside in a common, shared
// file 'build.common.gradle'. Being factored in this way makes it easier to
// integrate updates to the FTC into your code. If you really need to customize
// the build definitions, you can place those customizations in this file, but
// please think carefully as to whether such customizations are really necessary
// before doing so.

// Custom definitions may go here

// Include common definitions from above.
apply from: '../build.common.gradle'
apply from: '../build.dependencies.gradle'
apply from: 'suite-cost.gradle'

android {
    namespace = 'org.firstinspires.ftc.teamcode'

    packagingOptions {
        jniLibs.useLegacyPackaging true
    }
}

repositories {
    maven {
        url = 'https://maven.brott.dev/'
    }
}

// Java formatting. CI runs the same check as the second line, so run the first before pushing:
//   ./gradlew spotlessApply    formats every Java file of the simulator and the robot gateway
//   ./gradlew spotlessCheck    fails on any file the formatter would change
// palantir-java-format has no options to argue about: 4-space indent, 120 columns.
spotless {
    java {
        target 'src/test/**/*.java'
        palantirJavaFormat(palantirJavaFormatVersion)
        removeUnusedImports()
    }
}

def costDir = layout.buildDirectory.dir('sim/cost').get().asFile

afterEvaluate {
    tasks.withType(Test).names.each { judgeTheCostOf(tasks.named(it, Test), costDir) }
}

tasks.withType(Test).configureEach {
    dependsOn ':simcore:gatesAndTests'
    // Gradle's own -D reaches this JVM, not the forked test one, so pass the golden-trace
    // regeneration flag through by hand; without this the command FlightTrace prints would run as an
    // ordinary check and look like the traces simply agreed.
    if (System.getProperty('simTrace.regenerate') != null) {
        systemProperty 'simTrace.regenerate', System.getProperty('simTrace.regenerate')
    }
    // SIM_LIVE changes what every simulated run in the suite does: it holds each one to real time
    // and serves it live instead of running as fast as the machine can. So it is an input. Left
    // undeclared, a run with it set and a run without are up to date with respect to each other,
    // and the suite reports a verdict it reached under other conditions than the ones asked for.
    inputs.property('SIM_LIVE', System.getenv('SIM_LIVE')).optional(true)

    // What the suite costs. The test JVM keeps a ledger of the dear things -- child JVMs, compiles,
    // git, password hashes, formatting, node, project copies -- and writes it, a report and a
    // verdict as it goes.
    systemProperty 'suiteCost.ledger', costDir.absolutePath
    // What writes them is the JVM's agent, so they are written whatever the tests are: left to the
    // first test that touched the ledger, a run of one class that spends nothing counted would
    // write nothing, and the cost judge would fail it. The jar is only a manifest naming Cost. The JVM loads
    // an agent's class from the classpath, which makes it the very Cost the tests count into.
    def costAgent = layout.buildDirectory.file('sim/cost-agent.jar').get().asFile
    jvmArgs "-javaagent:${costAgent.absolutePath}".toString()
    // Gradle's own -D reaches this JVM and not the forked one, as with simTrace.regenerate above.
    if (System.getProperty('suiteCost.regenerate') != null) {
        systemProperty 'suiteCost.regenerate', System.getProperty('suiteCost.regenerate')
    }
    inputs.property('suiteCost.regenerate', System.getProperty('suiteCost.regenerate')).optional(true)

    doFirst {
        costDir.deleteDir()
        costDir.mkdirs()
        def manifest = new java.util.jar.Manifest()
        manifest.mainAttributes.put(java.util.jar.Attributes.Name.MANIFEST_VERSION, '1.0')
        manifest.mainAttributes.putValue('Premain-Class', 'org.firstinspires.ftc.teamcode.sim.Cost')
        new java.util.jar.JarOutputStream(new FileOutputStream(costAgent), manifest).close()
        // A filtered run spends less than the whole suite, and a run split across JVMs leaves each
        // of them with a share of it, so neither may judge the budget: the ledger is one JVM's.
        // The test JVM is told which kind of run it is rather than working it out; only Gradle
        // knows. Silence about that would read exactly like a suite that cost what it should.
        def whole = filter.commandLineIncludePatterns.isEmpty()
                && filter.includePatterns.isEmpty()
                && filter.excludePatterns.isEmpty()
                && maxParallelForks == 1
                && forkEvery == 0
        systemProperty 'suiteCost.whole', whole.toString()
    }
}

dependencies {
    implementation project(':FtcRobotController')

    implementation "com.acmerobotics.roadrunner:ftc:0.1.25"
    implementation "com.acmerobotics.roadrunner:core:1.0.1"
    implementation "com.acmerobotics.roadrunner:actions:1.0.1"
    implementation "com.acmerobotics.dashboard:dashboard:0.6.0"

    testImplementation "junit:junit:4.13.2"
    testImplementation project(':simcore')
    testImplementation testFixtures(project(':simcore'))
    testImplementation "com.google.code.gson:gson:2.11.0"
    // dyn4j, the rigid-body engine the simulated robot, the walls, the obstacles and the balls move in
    testImplementation "org.dyn4j:dyn4j:6.0.0"
    // scrypt, for the robot gateway's session store
    testImplementation "org.bouncycastle:bcprov-jdk18on:1.79"
}

// The simulation bench runs on the unit test classpath, the only one where the FTC SDK loads on
// a plain JVM. The simulator serves it to the browser on this machine.
afterEvaluate {
    // The robot gateway: teammates on the LAN log in, the admin approves them from a page only this
    // machine can reach, and an approved teammate's adb reaches the robot through it.
    //   ./gradlew :TeamCode:robotGateway
    //       admin  http://localhost:21987/admin   users  http://<LAN address>:21986/   robot  port 5555
    //   (ROBOT_GATEWAY_ADMIN_PORT, ROBOT_GATEWAY_USER_PORT and ROBOT_RELAY_PORT override the port numbers)
    tasks.register('robotGateway', JavaExec) {
        group = 'robot'
        description = 'Serve the robot gateway: admin on http://localhost:21987/admin, users on port 21986, adb on 5555'
        def unitTest = tasks.named('testDebugUnitTest').get()
        dependsOn unitTest.taskDependencies
        classpath = unitTest.classpath
        mainClass = 'org.firstinspires.ftc.teamcode.gateway.RobotGateway'
        workingDir = rootDir
    }

    // The simulator a teammate runs from their own checkout, on this machine only. Android Studio's
    // Simulator run configuration, under .run/, starts it.
    //   ./gradlew :TeamCode:simulator      http://127.0.0.1:21988/   (SIMULATOR_PORT overrides)
    tasks.register('simulator', JavaExec) {
        group = 'simulation'
        description = 'Serve the simulator for the sources in this checkout on http://127.0.0.1:21988/, this machine only'
        def unitTest = tasks.named('testDebugUnitTest').get()
        dependsOn unitTest.taskDependencies
        classpath = unitTest.classpath
        mainClass = 'org.firstinspires.ftc.teamcode.sim.LocalSimulator'
        workingDir = rootDir
    }

    //   ./gradlew :TeamCode:runCost [--args='<op mode> [seconds]']
    tasks.register('runCost', JavaExec) {
        group = 'simulation'
        description = 'What a run costs: each stage of simulating an op mode and carrying it to a live view'
        def unitTest = tasks.named('testDebugUnitTest').get()
        dependsOn unitTest.taskDependencies
        classpath = unitTest.classpath
        mainClass = 'org.firstinspires.ftc.teamcode.sim.RunCost'
        workingDir = projectDir
    }
}
