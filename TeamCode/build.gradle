apply plugin: 'com.android.application'
apply plugin: 'com.diffplug.spotless'

//
// build.gradle in TeamCode
//
// Most of the definitions for building your module reside in a common, shared
// file 'build.common.gradle'. Being factored in this way makes it easier to
// integrate updates to the FTC into your code. If you really need to customize
// the build definitions, you can place those customizations in this file, but
// please think carefully as to whether such customizations are really necessary
// before doing so.

// Custom definitions may go here

// Include common definitions from above.
apply from: '../build.common.gradle'
apply from: '../build.dependencies.gradle'

android {
    namespace = 'org.firstinspires.ftc.teamcode'

    packagingOptions {
        jniLibs.useLegacyPackaging true
    }
}

repositories {
    maven {
        url = 'https://maven.brott.dev/'
    }
}

// Java formatting. CI runs the same check as the second line, so run the first before pushing:
//   ./gradlew :TeamCode:spotlessApply    formats every Java file under TeamCode
//   ./gradlew :TeamCode:spotlessCheck    fails on any file the formatter would change
// palantir-java-format has no options to argue about: 4-space indent, 120 columns.
spotless {
    java {
        target 'src/**/*.java'
        palantirJavaFormat('2.98.0')
        removeUnusedImports()
    }
}

dependencies {
    implementation project(':FtcRobotController')

    implementation "com.acmerobotics.roadrunner:ftc:0.1.25"
    implementation "com.acmerobotics.roadrunner:core:1.0.1"
    implementation "com.acmerobotics.roadrunner:actions:1.0.1"
    implementation "com.acmerobotics.dashboard:dashboard:0.6.0"

    testImplementation "junit:junit:4.13.2"
    testImplementation "com.google.code.gson:gson:2.11.0"
    // scrypt, for the coding server's session store
    testImplementation "org.bouncycastle:bcprov-jdk18on:1.79"
}

// The simulation bench: a dev server that runs the autonomous op modes on the simulated robot
// and shows each run live. Runs on the unit test classpath, the only one where the FTC SDK
// loads on a plain JVM.
//   ./gradlew :TeamCode:simDev     then open http://localhost:8765/  (SIM_DEV_PORT overrides)
afterEvaluate {
    tasks.register('simDev', JavaExec) {
        group = 'simulation'
        description = 'Serve the simulation bench on http://localhost:8765/'
        def unitTest = tasks.named('testDebugUnitTest').get()
        dependsOn unitTest.taskDependencies
        classpath = unitTest.classpath
        mainClass = 'org.firstinspires.ftc.teamcode.sim.SimDevServer'
        workingDir = projectDir
    }

    // The coding server: teammates on the LAN edit the files the admin picks, after the admin
    // approves them from a page only this machine can reach.
    //   ./gradlew :TeamCode:codingServer
    //       admin  http://localhost:21987/admin   users  http://<LAN address>:21986/
    //   (CODING_ADMIN_PORT and CODING_USER_PORT override the port numbers)
    tasks.register('codingServer', JavaExec) {
        group = 'simulation'
        description = 'Serve the coding server: admin on http://localhost:21987/admin, users on port 21986'
        def unitTest = tasks.named('testDebugUnitTest').get()
        dependsOn unitTest.taskDependencies
        classpath = unitTest.classpath
        mainClass = 'org.firstinspires.ftc.teamcode.sim.CodingServer'
        workingDir = rootDir
    }
}
