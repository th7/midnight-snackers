name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests (same command as local)
        run: ./gradlew :TeamCode:testDebugUnitTest
      - name: Test report and simulation replays
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            TeamCode/build/test-results/testDebugUnitTest/*.xml
            TeamCode/build/sim/*.html
