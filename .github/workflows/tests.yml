name: tests

on:
  push:
    branches: [develop]
  pull_request:

concurrency:
  group: ${{ github.event_name == 'push' && 'tests-develop' || format('tests-pull-request-{0}', github.event.pull_request.number) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions: {}

defaults:
  run:
    shell: bash

jobs:
  tip:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      commit: ${{ steps.judged.outputs.commit }}
      subject: ${{ steps.judged.outputs.subject }}
      checkout: ${{ steps.checkout.outcome }}
      judged: ${{ steps.judged.outcome }}
    steps:
      - name: Check out develop's tip as it is now, or the pull request
        id: checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'push' && 'refs/heads/develop' || github.ref }}
          persist-credentials: false
      - name: Name the judged commit
        id: judged
        run: |
          commit=$(git rev-parse HEAD)
          subject=$(git log -1 --format=%s HEAD | base64 -w0)
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
          echo "subject=$subject" >> "$GITHUB_OUTPUT"

  linux:
    needs: tip
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      checkout: ${{ steps.checkout.outcome }}
      java: ${{ steps.java.outcome }}
      gradle: ${{ steps.gradle.outcome }}
      node: ${{ steps.node.outcome }}
      browser: ${{ steps.browser.outcome }}
      formatting: ${{ steps.formatting.outcome }}
      client-tools: ${{ steps.client-tools.outcome }}
      client-tests: ${{ steps.client-tests.outcome }}
      gateway-tools: ${{ steps.gateway-tools.outcome }}
      gateway-tests: ${{ steps.gateway-tests.outcome }}
      results: ${{ steps.results.outcome }}
    steps:
      - name: Check out the commit the tip job named, keeping no credential
        id: checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.tip.outputs.commit }}
          persist-credentials: false
      - name: Java 21
        id: java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Gradle, its cache written by runs for develop and only read by pull requests
        id: gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.event_name != 'push' }}
      - name: Node 22
        id: node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Browser for the page tests, with the shared libraries Chromium needs
        id: browser
        run: |
          npm ci --prefix tools/browser
          npx --prefix tools/browser playwright install --with-deps chromium
      - name: Java formatting (same command as local; fix with ./gradlew spotlessApply)
        id: formatting
        run: ./gradlew spotlessCheck
      - name: The client's tool tests (same command as local)
        id: client-tools
        run: python3 tools/run_tests.py client
      - name: The client's unit tests (same command as local)
        id: client-tests
        run: ./gradlew :TeamCode:testDebugUnitTest
      - name: The gateway's tool tests (same command as local)
        id: gateway-tools
        run: python3 tools/run_tests.py gateway
      - name: The gateway's unit tests (same command as local)
        id: gateway-tests
        run: ./gradlew :TeamCode:gatewayTest
      - name: Test report and simulation replays
        id: results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-linux
          path: |
            TeamCode/build/test-results/testDebugUnitTest/*.xml
            TeamCode/build/test-results/gatewayTest/*.xml
            TeamCode/build/sim/*.html
            tools/browser/field-as-drawn.png

  windows:
    needs: tip
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      checkout: ${{ steps.checkout.outcome }}
      java: ${{ steps.java.outcome }}
      gradle: ${{ steps.gradle.outcome }}
      node: ${{ steps.node.outcome }}
      browser: ${{ steps.browser.outcome }}
      formatting: ${{ steps.formatting.outcome }}
      client-tools: ${{ steps.client-tools.outcome }}
      client-tests: ${{ steps.client-tests.outcome }}
      results: ${{ steps.results.outcome }}
    steps:
      - name: Check out the commit the tip job named, keeping no credential
        id: checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.tip.outputs.commit }}
          persist-credentials: false
      - name: Java 21
        id: java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Gradle, its cache written by runs for develop and only read by pull requests
        id: gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.event_name != 'push' }}
      - name: Node 22
        id: node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Browser for the page tests
        id: browser
        run: |
          npm ci --prefix tools/browser
          npx --prefix tools/browser playwright install chromium
      - name: Java formatting (same command as local; fix with ./gradlew spotlessApply)
        id: formatting
        run: ./gradlew spotlessCheck
      - name: The client's tool tests (same command as local)
        id: client-tools
        run: python3 tools/run_tests.py client
      - name: The client's unit tests (same command as local)
        id: client-tests
        run: ./gradlew :TeamCode:testDebugUnitTest
      - name: Test report and simulation replays
        id: results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-windows
          path: |
            TeamCode/build/test-results/testDebugUnitTest/*.xml
            TeamCode/build/sim/*.html
            tools/browser/field-as-drawn.png

  look:
    needs: [tip, linux, windows]
    if: ${{ !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/develop' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      main-tip: ${{ steps.main.outputs.tip }}
      lacking: ${{ steps.main.outputs.lacking }}
      main-ahead: ${{ steps.main.outputs.ahead }}
      workflows-changed: ${{ steps.main.outputs.changed }}
      workflows-differing: ${{ steps.main.outputs.differing }}
      decision: ${{ steps.decide.outputs.decision }}
    steps:
      - name: Check out the judged commit with every branch's history, keeping no credential
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.tip.outputs.commit || 'refs/heads/develop' }}
          fetch-depth: 0
          persist-credentials: false
      - name: Find where main stands, what main has that develop or the judged commit lacks, and the workflow files the commits since main change or main and the judged commit differ in
        id: main
        run: |
          tip=$(git rev-parse refs/remotes/origin/main)
          lacking=$(git log --format='%H %s' refs/remotes/origin/develop..refs/remotes/origin/main | base64 -w0)
          ahead=$(git log --format='%H %s' HEAD..refs/remotes/origin/main | base64 -w0)
          changed=$(git log --full-history --no-renames --cc --format= --name-only refs/remotes/origin/main..HEAD -- .github/workflows | base64 -w0)
          differing=$(git diff --no-renames --name-only refs/remotes/origin/main HEAD -- .github/workflows | base64 -w0)
          echo "tip=$tip" >> "$GITHUB_OUTPUT"
          echo "lacking=$lacking" >> "$GITHUB_OUTPUT"
          echo "ahead=$ahead" >> "$GITHUB_OUTPUT"
          echo "changed=$changed" >> "$GITHUB_OUTPUT"
          echo "differing=$differing" >> "$GITHUB_OUTPUT"
      - name: Decide whether main moves
        id: decide
        env:
          TIP_ENDED: ${{ needs.tip.result }}
          JUDGED: ${{ needs.tip.outputs.commit }}
          SUBJECT: ${{ needs.tip.outputs.subject }}
          STEP_TIP_CHECKOUT: ${{ needs.tip.outputs.checkout }}
          STEP_TIP_JUDGED: ${{ needs.tip.outputs.judged }}
          LINUX_ENDED: ${{ needs.linux.result }}
          STEP_LINUX_CHECKOUT: ${{ needs.linux.outputs.checkout }}
          STEP_LINUX_JAVA: ${{ needs.linux.outputs.java }}
          STEP_LINUX_GRADLE: ${{ needs.linux.outputs.gradle }}
          STEP_LINUX_NODE: ${{ needs.linux.outputs.node }}
          STEP_LINUX_BROWSER: ${{ needs.linux.outputs.browser }}
          STEP_LINUX_FORMATTING: ${{ needs.linux.outputs.formatting }}
          STEP_LINUX_CLIENT_TOOLS: ${{ needs.linux.outputs.client-tools }}
          STEP_LINUX_CLIENT_TESTS: ${{ needs.linux.outputs.client-tests }}
          STEP_LINUX_GATEWAY_TOOLS: ${{ needs.linux.outputs.gateway-tools }}
          STEP_LINUX_GATEWAY_TESTS: ${{ needs.linux.outputs.gateway-tests }}
          STEP_LINUX_RESULTS: ${{ needs.linux.outputs.results }}
          WINDOWS_ENDED: ${{ needs.windows.result }}
          STEP_WINDOWS_CHECKOUT: ${{ needs.windows.outputs.checkout }}
          STEP_WINDOWS_JAVA: ${{ needs.windows.outputs.java }}
          STEP_WINDOWS_GRADLE: ${{ needs.windows.outputs.gradle }}
          STEP_WINDOWS_NODE: ${{ needs.windows.outputs.node }}
          STEP_WINDOWS_BROWSER: ${{ needs.windows.outputs.browser }}
          STEP_WINDOWS_FORMATTING: ${{ needs.windows.outputs.formatting }}
          STEP_WINDOWS_CLIENT_TOOLS: ${{ needs.windows.outputs.client-tools }}
          STEP_WINDOWS_CLIENT_TESTS: ${{ needs.windows.outputs.client-tests }}
          STEP_WINDOWS_RESULTS: ${{ needs.windows.outputs.results }}
          LACKING: ${{ steps.main.outputs.lacking }}
          MAIN_AHEAD: ${{ steps.main.outputs.ahead }}
          WORKFLOWS_CHANGED: ${{ steps.main.outputs.changed }}
          WORKFLOWS_DIFFERING: ${{ steps.main.outputs.differing }}
        run: python3 tools/ci/develop_run_cli.py promotion >> "$GITHUB_OUTPUT"
      - name: Fail unless main moves or stays, so that re-running the failed jobs looks at main again
        if: steps.decide.outputs.decision != 'move' && steps.decide.outputs.decision != 'stay'
        run: exit 1

  promote:
    needs: [tip, linux, windows, look]
    if: ${{ !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/develop' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      pushed: ${{ steps.push.outcome }}
      git-said: ${{ steps.push.outputs.said }}
    steps:
      - name: Check out the judged commit with all of history and the built-in token, running none of its code
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.tip.outputs.commit || 'refs/heads/develop' }}
          fetch-depth: 0
      - name: Find where main stands now and whether develop holds it, as this job's checkout fetched them
        id: main
        run: |
          tip=$(git rev-parse refs/remotes/origin/main)
          along=false
          if git merge-base --is-ancestor "$tip" refs/remotes/origin/develop; then
            along=true
          fi
          echo "tip=$tip" >> "$GITHUB_OUTPUT"
          echo "along=$along" >> "$GITHUB_OUTPUT"
      - name: Move main to the judged commit, never by force, only from where the job that looks found it
        id: push
        if: needs.linux.result == 'success' && needs.windows.result == 'success' && needs.look.result == 'success' && needs.look.outputs.decision == 'move' && steps.main.outputs.tip == needs.look.outputs.main-tip
        env:
          JUDGED: ${{ needs.tip.outputs.commit }}
        run: |
          pushed=0
          git push origin "$JUDGED:refs/heads/main" > "$RUNNER_TEMP/git-said" 2>&1 || pushed=$?
          cat "$RUNNER_TEMP/git-said"
          said=$(base64 -w0 < "$RUNNER_TEMP/git-said")
          echo "said=$said" >> "$GITHUB_OUTPUT"
          exit "$pushed"
      - name: Push nothing once main has moved along develop since the job that looks found it, saying so
        if: needs.linux.result == 'success' && needs.windows.result == 'success' && needs.look.result == 'success' && steps.main.outputs.tip != needs.look.outputs.main-tip && steps.main.outputs.along == 'true'
        env:
          FOUND: ${{ needs.look.outputs.main-tip }}
          NOW: ${{ steps.main.outputs.tip }}
        run: |
          echo "main moved along develop since the job that looks found it at $FOUND: its tip is now $NOW, which develop holds, so this run pushes nothing, and a run that looks at main again, for a new push to develop or re-running all of this run's jobs, speaks for develop."
      - name: Fail once main has moved since the job that looks found it to a tip this job could not find in develop, pushing nothing and saying so
        if: needs.linux.result == 'success' && needs.windows.result == 'success' && needs.look.result == 'success' && steps.main.outputs.tip != needs.look.outputs.main-tip && steps.main.outputs.along != 'true'
        env:
          FOUND: ${{ needs.look.outputs.main-tip }}
          NOW: ${{ steps.main.outputs.tip }}
        run: |
          echo "main moved since the job that looks found it at $FOUND: its tip is now $NOW, which this job could not find in develop as its checkout fetched it, so this run pushes nothing and is red." >&2
          exit 1
      - name: Hold main where it was
        if: needs.linux.result != 'success' || needs.windows.result != 'success' || needs.look.result != 'success'
        run: exit 1

  say:
    needs: [tip, linux, windows, look, promote]
    if: ${{ !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/develop' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: read
    outputs:
      action: ${{ steps.say.outputs.action }}
      title: ${{ steps.say.outputs.title }}
      issues: ${{ steps.say.outputs.issues }}
      body: ${{ steps.say.outputs.body }}
    steps:
      - name: List the open issues, before any of the judged commit is on disk
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue list --repo "$GITHUB_REPOSITORY" --state open --limit 1000 --json number,title > "$RUNNER_TEMP/open-issues.json"
      - name: Read develop's tip as it is now, before any of the judged commit is on disk
        id: develop
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tip=$(gh api --method GET "repos/$GITHUB_REPOSITORY/git/ref/heads/develop" --jq .object.sha)
          if [[ ! $tip =~ ^([0-9a-f]{40}|[0-9a-f]{64})$ ]]; then
            echo "gh answered no commit hash for the tip of develop: $tip" >&2
            exit 1
          fi
          echo "tip=$tip" >> "$GITHUB_OUTPUT"
      - name: Read main's tip as it is now, before any of the judged commit is on disk
        id: main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tip=$(gh api --method GET "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)
          if [[ ! $tip =~ ^([0-9a-f]{40}|[0-9a-f]{64})$ ]]; then
            echo "gh answered no commit hash for the tip of main: $tip" >&2
            exit 1
          fi
          echo "tip=$tip" >> "$GITHUB_OUTPUT"
      - name: Check out the judged commit, keeping no credential
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.tip.outputs.commit || 'refs/heads/develop' }}
          persist-credentials: false
      - name: Say what the run found
        id: say
        env:
          TIP_ENDED: ${{ needs.tip.result }}
          JUDGED: ${{ needs.tip.outputs.commit }}
          SUBJECT: ${{ needs.tip.outputs.subject }}
          STEP_TIP_CHECKOUT: ${{ needs.tip.outputs.checkout }}
          STEP_TIP_JUDGED: ${{ needs.tip.outputs.judged }}
          LINUX_ENDED: ${{ needs.linux.result }}
          STEP_LINUX_CHECKOUT: ${{ needs.linux.outputs.checkout }}
          STEP_LINUX_JAVA: ${{ needs.linux.outputs.java }}
          STEP_LINUX_GRADLE: ${{ needs.linux.outputs.gradle }}
          STEP_LINUX_NODE: ${{ needs.linux.outputs.node }}
          STEP_LINUX_BROWSER: ${{ needs.linux.outputs.browser }}
          STEP_LINUX_FORMATTING: ${{ needs.linux.outputs.formatting }}
          STEP_LINUX_CLIENT_TOOLS: ${{ needs.linux.outputs.client-tools }}
          STEP_LINUX_CLIENT_TESTS: ${{ needs.linux.outputs.client-tests }}
          STEP_LINUX_GATEWAY_TOOLS: ${{ needs.linux.outputs.gateway-tools }}
          STEP_LINUX_GATEWAY_TESTS: ${{ needs.linux.outputs.gateway-tests }}
          STEP_LINUX_RESULTS: ${{ needs.linux.outputs.results }}
          WINDOWS_ENDED: ${{ needs.windows.result }}
          STEP_WINDOWS_CHECKOUT: ${{ needs.windows.outputs.checkout }}
          STEP_WINDOWS_JAVA: ${{ needs.windows.outputs.java }}
          STEP_WINDOWS_GRADLE: ${{ needs.windows.outputs.gradle }}
          STEP_WINDOWS_NODE: ${{ needs.windows.outputs.node }}
          STEP_WINDOWS_BROWSER: ${{ needs.windows.outputs.browser }}
          STEP_WINDOWS_FORMATTING: ${{ needs.windows.outputs.formatting }}
          STEP_WINDOWS_CLIENT_TOOLS: ${{ needs.windows.outputs.client-tools }}
          STEP_WINDOWS_CLIENT_TESTS: ${{ needs.windows.outputs.client-tests }}
          STEP_WINDOWS_RESULTS: ${{ needs.windows.outputs.results }}
          LOOKING_ENDED: ${{ needs.look.result }}
          MAIN_FOUND: ${{ needs.look.outputs.main-tip }}
          MAIN_TIP: ${{ steps.main.outputs.tip }}
          DEVELOP_TIP: ${{ steps.develop.outputs.tip }}
          LACKING: ${{ needs.look.outputs.lacking }}
          MAIN_AHEAD: ${{ needs.look.outputs.main-ahead }}
          WORKFLOWS_CHANGED: ${{ needs.look.outputs.workflows-changed }}
          WORKFLOWS_DIFFERING: ${{ needs.look.outputs.workflows-differing }}
          PROMOTING_ENDED: ${{ needs.promote.result }}
          PUSHED: ${{ needs.promote.outputs.pushed }}
          GIT_SAID: ${{ needs.promote.outputs.git-said }}
        run: python3 tools/ci/develop_run_cli.py report "$RUNNER_TEMP/open-issues.json" >> "$GITHUB_OUTPUT"

  report:
    needs: [tip, linux, windows, look, promote, say]
    if: ${{ !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/develop' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - name: Read develop's tip as it is now, before writing anything to the issue
        id: develop
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tip=$(gh api --method GET "repos/$GITHUB_REPOSITORY/git/ref/heads/develop" --jq .object.sha)
          if [[ ! $tip =~ ^([0-9a-f]{40}|[0-9a-f]{64})$ ]]; then
            echo "gh answered no commit hash for the tip of develop: $tip" >&2
            exit 1
          fi
          echo "tip=$tip" >> "$GITHUB_OUTPUT"
      - name: Read main's tip as it is now, before writing anything to the issue
        id: main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tip=$(gh api --method GET "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)
          if [[ ! $tip =~ ^([0-9a-f]{40}|[0-9a-f]{64})$ ]]; then
            echo "gh answered no commit hash for the tip of main: $tip" >&2
            exit 1
          fi
          echo "tip=$tip" >> "$GITHUB_OUTPUT"
      - name: Fail unless develop holds main's tip as both are now, as GitHub compares them, so that no run is green while main has a commit develop lacks, whatever the core said
        id: holds
        env:
          GH_TOKEN: ${{ github.token }}
          MAIN: ${{ steps.main.outputs.tip }}
          DEVELOP: ${{ steps.develop.outputs.tip }}
        run: |
          status=$(gh api --method GET "repos/$GITHUB_REPOSITORY/compare/$MAIN...$DEVELOP" --jq .status)
          if [[ $status != ahead && $status != identical ]]; then
            echo "develop does not hold main's tip as GitHub compares them now: main's tip is $MAIN, develop's is $DEVELOP, and GitHub answered $status where only ahead or identical passes, so this run is red whatever the core said." >&2
            exit 1
          fi
      - name: Open the issue
        id: open
        if: ${{ !cancelled() && needs.say.outputs.action == 'open' }}
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: ${{ needs.say.outputs.title }}
          BODY: ${{ needs.say.outputs.body }}
        run: |
          base64 -d <<< "$BODY" > "$RUNNER_TEMP/issue-body.md"
          gh issue create --repo "$GITHUB_REPOSITORY" --title "$TITLE" --body-file "$RUNNER_TEMP/issue-body.md"
      - name: Comment on the open issue
        id: comment
        if: ${{ !cancelled() && needs.say.outputs.action == 'comment' }}
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ needs.say.outputs.issues }}
          BODY: ${{ needs.say.outputs.body }}
        run: |
          base64 -d <<< "$BODY" > "$RUNNER_TEMP/issue-body.md"
          gh issue comment --repo "$GITHUB_REPOSITORY" --body-file "$RUNNER_TEMP/issue-body.md" -- "$ISSUE"
      - name: Comment on the open issue that develop moved on past the commit judged green, only when no step before failed
        id: moved-on
        if: needs.say.outputs.action == 'moved-on'
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ needs.say.outputs.issues }}
          BODY: ${{ needs.say.outputs.body }}
        run: |
          base64 -d <<< "$BODY" > "$RUNNER_TEMP/issue-body.md"
          gh issue comment --repo "$GITHUB_REPOSITORY" --body-file "$RUNNER_TEMP/issue-body.md" -- "$ISSUE"
      - name: Close the issue, saying main now stands at the judged commit, only when every job before passed and that commit is still both develop's tip and main's
        id: close
        if: needs.say.outputs.action == 'close' && needs.linux.result == 'success' && needs.windows.result == 'success' && needs.look.result == 'success' && needs.promote.result == 'success' && needs.say.result == 'success' && steps.develop.outputs.tip == needs.tip.outputs.commit && steps.main.outputs.tip == needs.tip.outputs.commit
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUES: ${{ needs.say.outputs.issues }}
          BODY: ${{ needs.say.outputs.body }}
        run: |
          base64 -d <<< "$BODY" > "$RUNNER_TEMP/issue-body.md"
          for issue in $ISSUES; do
            gh issue comment --repo "$GITHUB_REPOSITORY" --body-file "$RUNNER_TEMP/issue-body.md" -- "$issue"
            gh issue close --repo "$GITHUB_REPOSITORY" -- "$issue"
          done
      - name: Say on the issue where develop's tip and main's now stand, when every job before passed, the core said close and only main's is still the judged commit
        id: behind
        if: needs.say.outputs.action == 'close' && needs.linux.result == 'success' && needs.windows.result == 'success' && needs.look.result == 'success' && needs.promote.result == 'success' && needs.say.result == 'success' && steps.main.outputs.tip == needs.tip.outputs.commit && steps.develop.outputs.tip != needs.tip.outputs.commit
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUES: ${{ needs.say.outputs.issues }}
          JUDGED: ${{ needs.tip.outputs.commit }}
          DEVELOP_TIP: ${{ steps.develop.outputs.tip }}
          MAIN_TIP: ${{ steps.main.outputs.tip }}
        run: |
          link="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          body=$(printf '%s\n\nThe run: %s' "develop was judged green at $JUDGED, but develop's tip is now $DEVELOP_TIP and main's is $MAIN_TIP, and a run closes this issue only when it finds both at the commit it judged, so this run does not close it." "$link")
          for issue in $ISSUES; do
            gh issue comment --repo "$GITHUB_REPOSITORY" --body "$body" -- "$issue"
          done
      - name: Write nothing to the issue once main has moved since this run looked at it, saying so, when every job before passed, the core said close and main's tip is not the judged commit
        id: moved
        if: needs.say.outputs.action == 'close' && needs.linux.result == 'success' && needs.windows.result == 'success' && needs.look.result == 'success' && needs.promote.result == 'success' && needs.say.result == 'success' && steps.main.outputs.tip != needs.tip.outputs.commit
        env:
          JUDGED: ${{ needs.tip.outputs.commit }}
          MAIN_TIP: ${{ steps.main.outputs.tip }}
        run: |
          echo "main moved since this run looked at it: its tip is now $MAIN_TIP, not the judged commit $JUDGED, so this run writes nothing to the issue, and a run that looks at main again, for a new push to develop or re-running all of this run's jobs, speaks for develop."
      - name: Open or comment on the issue saying only that the run is red, when nothing else said so
        if: ${{ !cancelled() && steps.open.outcome != 'success' && steps.comment.outcome != 'success' && (failure() || needs.linux.result != 'success' || needs.windows.result != 'success' || needs.look.result != 'success' || needs.promote.result != 'success' || needs.say.result != 'success') }}
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: 'IMPORTANT: develop CI Failures'
        run: |
          link="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          body="A run for develop is red, and the jobs that say why could not, so only the run itself says what failed: $link"
          gh issue list --repo "$GITHUB_REPOSITORY" --state open --limit 1000 --json number,title > "$RUNNER_TEMP/open-issues.json"
          issue=$(jq -r --arg title "$TITLE" '[.[] | select(.title == $title) | .number] | min // empty' "$RUNNER_TEMP/open-issues.json")
          if [ -n "$issue" ]; then
            gh issue comment --repo "$GITHUB_REPOSITORY" --body "$body" -- "$issue"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$TITLE" --body "$body"
          fi
