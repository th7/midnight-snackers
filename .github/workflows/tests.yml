name: tests

on:
  push:
    branches: [develop]
  pull_request:

concurrency:
  group: ${{ github.event_name == 'push' && 'tests-develop' || format('tests-pull-request-{0}', github.event.pull_request.number) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions: {}

defaults:
  run:
    shell: bash

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      commit: ${{ steps.judged.outputs.commit }}
      subject: ${{ steps.judged.outputs.subject }}
      checkout: ${{ steps.checkout.outcome }}
      judged: ${{ steps.judged.outcome }}
      java: ${{ steps.java.outcome }}
      gradle: ${{ steps.gradle.outcome }}
      node: ${{ steps.node.outcome }}
      browser: ${{ steps.browser.outcome }}
      formatting: ${{ steps.formatting.outcome }}
      tool-tests: ${{ steps.tool-tests.outcome }}
      unit-tests: ${{ steps.unit-tests.outcome }}
      results: ${{ steps.results.outcome }}
    steps:
      - name: Check out develop's tip as it is now, or the pull request
        id: checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'push' && 'refs/heads/develop' || github.ref }}
          persist-credentials: false
      - name: Name the judged commit
        id: judged
        run: |
          commit=$(git rev-parse HEAD)
          subject=$(git log -1 --format=%s HEAD | base64 -w0)
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
          echo "subject=$subject" >> "$GITHUB_OUTPUT"
      - name: Java 21
        id: java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Gradle, its cache written by runs for develop and only read by pull requests
        id: gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.event_name != 'push' }}
      - name: Node 22
        id: node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Browser for the page tests, with the shared libraries Chromium needs
        id: browser
        run: |
          npm ci --prefix tools/browser
          npx --prefix tools/browser playwright install --with-deps chromium
      - name: Java formatting (same command as local; fix with ./gradlew spotlessApply)
        id: formatting
        run: ./gradlew spotlessCheck
      - name: Tool tests (same command as local)
        id: tool-tests
        run: python3 tools/run_tests.py
      - name: Unit tests (same command as local)
        id: unit-tests
        run: ./gradlew :TeamCode:testDebugUnitTest
      - name: Test report and simulation replays
        id: results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            TeamCode/build/test-results/testDebugUnitTest/*.xml
            TeamCode/build/sim/*.html
            tools/browser/field-as-drawn.png

  promote:
    needs: unit-tests
    if: ${{ !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/develop' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: main
    permissions:
      contents: write
    outputs:
      main-tip: ${{ steps.main.outputs.tip }}
      lacking: ${{ steps.main.outputs.lacking }}
      main-ahead: ${{ steps.main.outputs.ahead }}
      pushed: ${{ steps.push.outcome }}
      git-said: ${{ steps.push.outputs.said }}
    steps:
      - name: Check out the judged commit
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.unit-tests.outputs.commit || 'refs/heads/develop' }}
          fetch-depth: 0
      - name: Find what main has that develop lacks, and what it has that the judged commit lacks
        id: main
        run: |
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main +refs/heads/develop:refs/remotes/origin/develop
          tip=$(git rev-parse refs/remotes/origin/main)
          lacking=$(git log --format='%H %s' refs/remotes/origin/develop..refs/remotes/origin/main | base64 -w0)
          ahead=$(git log --format='%H %s' HEAD..refs/remotes/origin/main | base64 -w0)
          echo "tip=$tip" >> "$GITHUB_OUTPUT"
          echo "lacking=$lacking" >> "$GITHUB_OUTPUT"
          echo "ahead=$ahead" >> "$GITHUB_OUTPUT"
      - name: Decide whether main moves
        id: decide
        env:
          JUDGING_ENDED: ${{ needs.unit-tests.result }}
          JUDGED: ${{ needs.unit-tests.outputs.commit }}
          SUBJECT: ${{ needs.unit-tests.outputs.subject }}
          STEP_CHECKOUT: ${{ needs.unit-tests.outputs.checkout }}
          STEP_JUDGED: ${{ needs.unit-tests.outputs.judged }}
          STEP_JAVA: ${{ needs.unit-tests.outputs.java }}
          STEP_GRADLE: ${{ needs.unit-tests.outputs.gradle }}
          STEP_NODE: ${{ needs.unit-tests.outputs.node }}
          STEP_BROWSER: ${{ needs.unit-tests.outputs.browser }}
          STEP_FORMATTING: ${{ needs.unit-tests.outputs.formatting }}
          STEP_TOOL_TESTS: ${{ needs.unit-tests.outputs.tool-tests }}
          STEP_UNIT_TESTS: ${{ needs.unit-tests.outputs.unit-tests }}
          STEP_RESULTS: ${{ needs.unit-tests.outputs.results }}
          LACKING: ${{ steps.main.outputs.lacking }}
          MAIN_AHEAD: ${{ steps.main.outputs.ahead }}
        run: python3 tools/ci/develop_run_cli.py promotion >> "$GITHUB_OUTPUT"
      - name: Move main to the judged commit, never by force
        id: push
        if: steps.decide.outputs.decision == 'move'
        env:
          JUDGED: ${{ steps.decide.outputs.commit }}
          PUSH_TOKEN: ${{ secrets.MAIN_PUSH_TOKEN || github.token }}
        run: |
          auth=$(printf 'x-access-token:%s' "$PUSH_TOKEN" | base64 -w0)
          export GIT_CONFIG_COUNT=2
          export GIT_CONFIG_KEY_0="http.$GITHUB_SERVER_URL/.extraheader" GIT_CONFIG_VALUE_0=
          export GIT_CONFIG_KEY_1="http.$GITHUB_SERVER_URL/.extraheader" GIT_CONFIG_VALUE_1="AUTHORIZATION: basic $auth"
          pushed=0
          git push origin "$JUDGED:refs/heads/main" > "$RUNNER_TEMP/git-said" 2>&1 || pushed=$?
          cat "$RUNNER_TEMP/git-said"
          said=$(base64 -w0 < "$RUNNER_TEMP/git-said")
          echo "said=$said" >> "$GITHUB_OUTPUT"
          exit "$pushed"
      - name: Hold main where it was
        if: steps.decide.outputs.decision != 'move' && steps.decide.outputs.decision != 'stay'
        run: exit 1

  report:
    needs: [unit-tests, promote]
    if: ${{ !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/develop' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - name: Check out the judged commit
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.unit-tests.outputs.commit || 'refs/heads/develop' }}
          persist-credentials: false
      - name: List the open issues
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue list --repo "$GITHUB_REPOSITORY" --state open --limit 1000 --json number,title > "$RUNNER_TEMP/open-issues.json"
      - name: Say what the run found
        id: say
        env:
          JUDGING_ENDED: ${{ needs.unit-tests.result }}
          JUDGED: ${{ needs.unit-tests.outputs.commit }}
          SUBJECT: ${{ needs.unit-tests.outputs.subject }}
          STEP_CHECKOUT: ${{ needs.unit-tests.outputs.checkout }}
          STEP_JUDGED: ${{ needs.unit-tests.outputs.judged }}
          STEP_JAVA: ${{ needs.unit-tests.outputs.java }}
          STEP_GRADLE: ${{ needs.unit-tests.outputs.gradle }}
          STEP_NODE: ${{ needs.unit-tests.outputs.node }}
          STEP_BROWSER: ${{ needs.unit-tests.outputs.browser }}
          STEP_FORMATTING: ${{ needs.unit-tests.outputs.formatting }}
          STEP_TOOL_TESTS: ${{ needs.unit-tests.outputs.tool-tests }}
          STEP_UNIT_TESTS: ${{ needs.unit-tests.outputs.unit-tests }}
          STEP_RESULTS: ${{ needs.unit-tests.outputs.results }}
          PROMOTING_ENDED: ${{ needs.promote.result }}
          MAIN_TIP: ${{ needs.promote.outputs.main-tip }}
          LACKING: ${{ needs.promote.outputs.lacking }}
          MAIN_AHEAD: ${{ needs.promote.outputs.main-ahead }}
          PUSHED: ${{ needs.promote.outputs.pushed }}
          GIT_SAID: ${{ needs.promote.outputs.git-said }}
        run: python3 tools/ci/develop_run_cli.py report "$RUNNER_TEMP/open-issues.json" "$RUNNER_TEMP/issue-body.md" >> "$GITHUB_OUTPUT"
      - name: Open the issue
        if: steps.say.outputs.action == 'open'
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: ${{ steps.say.outputs.title }}
        run: gh issue create --repo "$GITHUB_REPOSITORY" --title "$TITLE" --body-file "$RUNNER_TEMP/issue-body.md"
      - name: Comment on the open issue
        if: steps.say.outputs.action == 'comment'
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ steps.say.outputs.issues }}
        run: gh issue comment "$ISSUE" --repo "$GITHUB_REPOSITORY" --body-file "$RUNNER_TEMP/issue-body.md"
      - name: Close the issue, saying main now stands at the judged commit
        if: steps.say.outputs.action == 'close'
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUES: ${{ steps.say.outputs.issues }}
        run: |
          for issue in $ISSUES; do
            gh issue comment "$issue" --repo "$GITHUB_REPOSITORY" --body-file "$RUNNER_TEMP/issue-body.md"
            gh issue close "$issue" --repo "$GITHUB_REPOSITORY"
          done
