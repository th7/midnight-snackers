name: tests

on:
  push:
    branches: [develop]
  pull_request:

concurrency:
  group: ${{ github.event_name == 'push' && 'tests-develop' || format('tests-pull-request-{0}', github.event.pull_request.number) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions: {}

defaults:
  run:
    shell: bash

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      commit: ${{ steps.judged.outputs.commit }}
      subject: ${{ steps.judged.outputs.subject }}
      checkout: ${{ steps.checkout.outcome }}
      judged: ${{ steps.judged.outcome }}
      java: ${{ steps.java.outcome }}
      gradle: ${{ steps.gradle.outcome }}
      node: ${{ steps.node.outcome }}
      browser: ${{ steps.browser.outcome }}
      formatting: ${{ steps.formatting.outcome }}
      tool-tests: ${{ steps.tool-tests.outcome }}
      unit-tests: ${{ steps.unit-tests.outcome }}
      results: ${{ steps.results.outcome }}
    steps:
      - name: Check out develop's tip as it is now, or the pull request
        id: checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'push' && 'refs/heads/develop' || github.ref }}
          persist-credentials: false
      - name: Name the judged commit
        id: judged
        run: |
          commit=$(git rev-parse HEAD)
          subject=$(git log -1 --format=%s HEAD | base64 -w0)
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
          echo "subject=$subject" >> "$GITHUB_OUTPUT"
      - name: Java 21
        id: java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Gradle, its cache written by runs for develop and only read by pull requests
        id: gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.event_name != 'push' }}
      - name: Node 22
        id: node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Browser for the page tests, with the shared libraries Chromium needs
        id: browser
        run: |
          npm ci --prefix tools/browser
          npx --prefix tools/browser playwright install --with-deps chromium
      - name: Java formatting (same command as local; fix with ./gradlew spotlessApply)
        id: formatting
        run: ./gradlew spotlessCheck
      - name: Tool tests (same command as local)
        id: tool-tests
        run: python3 tools/run_tests.py
      - name: Unit tests (same command as local)
        id: unit-tests
        run: ./gradlew :TeamCode:testDebugUnitTest
      - name: Test report and simulation replays
        id: results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            TeamCode/build/test-results/testDebugUnitTest/*.xml
            TeamCode/build/sim/*.html
            tools/browser/field-as-drawn.png

  look:
    needs: unit-tests
    if: ${{ !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/develop' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      main-tip: ${{ steps.main.outputs.tip }}
      lacking: ${{ steps.main.outputs.lacking }}
      main-ahead: ${{ steps.main.outputs.ahead }}
      workflows-changed: ${{ steps.main.outputs.changed }}
      workflows-differing: ${{ steps.main.outputs.differing }}
      decision: ${{ steps.decide.outputs.decision }}
    steps:
      - name: Check out the judged commit with every branch's history, keeping no credential
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.unit-tests.outputs.commit || 'refs/heads/develop' }}
          fetch-depth: 0
          persist-credentials: false
      - name: Find where main stands, what main has that develop or the judged commit lacks, and the workflow files the commits since main change or main and the judged commit differ in
        id: main
        run: |
          tip=$(git rev-parse refs/remotes/origin/main)
          lacking=$(git log --format='%H %s' refs/remotes/origin/develop..refs/remotes/origin/main | base64 -w0)
          ahead=$(git log --format='%H %s' HEAD..refs/remotes/origin/main | base64 -w0)
          changed=$(git log --full-history --no-renames --cc --format= --name-only refs/remotes/origin/main..HEAD -- .github/workflows | base64 -w0)
          differing=$(git diff --no-renames --name-only refs/remotes/origin/main HEAD -- .github/workflows | base64 -w0)
          echo "tip=$tip" >> "$GITHUB_OUTPUT"
          echo "lacking=$lacking" >> "$GITHUB_OUTPUT"
          echo "ahead=$ahead" >> "$GITHUB_OUTPUT"
          echo "changed=$changed" >> "$GITHUB_OUTPUT"
          echo "differing=$differing" >> "$GITHUB_OUTPUT"
      - name: Decide whether main moves
        id: decide
        env:
          JUDGING_ENDED: ${{ needs.unit-tests.result }}
          JUDGED: ${{ needs.unit-tests.outputs.commit }}
          SUBJECT: ${{ needs.unit-tests.outputs.subject }}
          STEP_CHECKOUT: ${{ needs.unit-tests.outputs.checkout }}
          STEP_JUDGED: ${{ needs.unit-tests.outputs.judged }}
          STEP_JAVA: ${{ needs.unit-tests.outputs.java }}
          STEP_GRADLE: ${{ needs.unit-tests.outputs.gradle }}
          STEP_NODE: ${{ needs.unit-tests.outputs.node }}
          STEP_BROWSER: ${{ needs.unit-tests.outputs.browser }}
          STEP_FORMATTING: ${{ needs.unit-tests.outputs.formatting }}
          STEP_TOOL_TESTS: ${{ needs.unit-tests.outputs.tool-tests }}
          STEP_UNIT_TESTS: ${{ needs.unit-tests.outputs.unit-tests }}
          STEP_RESULTS: ${{ needs.unit-tests.outputs.results }}
          LACKING: ${{ steps.main.outputs.lacking }}
          MAIN_AHEAD: ${{ steps.main.outputs.ahead }}
          WORKFLOWS_CHANGED: ${{ steps.main.outputs.changed }}
          WORKFLOWS_DIFFERING: ${{ steps.main.outputs.differing }}
        run: python3 tools/ci/develop_run_cli.py promotion >> "$GITHUB_OUTPUT"
      - name: Fail unless main moves or stays, so that re-running the failed jobs looks at main again
        if: steps.decide.outputs.decision != 'move' && steps.decide.outputs.decision != 'stay'
        run: exit 1

  promote:
    needs: [unit-tests, look]
    if: ${{ !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/develop' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      pushed: ${{ steps.push.outcome }}
      git-said: ${{ steps.push.outputs.said }}
    steps:
      - name: Check out the judged commit with all of history and the built-in token, running none of its code
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.unit-tests.outputs.commit || 'refs/heads/develop' }}
          fetch-depth: 0
      - name: Move main to the judged commit, never by force
        id: push
        if: needs.unit-tests.result == 'success' && needs.look.result == 'success' && needs.look.outputs.decision == 'move'
        env:
          JUDGED: ${{ needs.unit-tests.outputs.commit }}
        run: |
          pushed=0
          git push origin "$JUDGED:refs/heads/main" > "$RUNNER_TEMP/git-said" 2>&1 || pushed=$?
          cat "$RUNNER_TEMP/git-said"
          said=$(base64 -w0 < "$RUNNER_TEMP/git-said")
          echo "said=$said" >> "$GITHUB_OUTPUT"
          exit "$pushed"
      - name: Hold main where it was
        if: needs.unit-tests.result != 'success' || needs.look.result != 'success'
        run: exit 1

  say:
    needs: [unit-tests, look, promote]
    if: ${{ !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/develop' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: read
    outputs:
      action: ${{ steps.say.outputs.action }}
      title: ${{ steps.say.outputs.title }}
      issues: ${{ steps.say.outputs.issues }}
      body: ${{ steps.say.outputs.body }}
    steps:
      - name: List the open issues, before any of the judged commit is on disk
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue list --repo "$GITHUB_REPOSITORY" --state open --limit 1000 --json number,title > "$RUNNER_TEMP/open-issues.json"
      - name: Read develop's tip as it is now, before any of the judged commit is on disk
        id: develop
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tip=$(gh api --method GET "repos/$GITHUB_REPOSITORY/git/ref/heads/develop" --jq .object.sha)
          if [[ ! $tip =~ ^([0-9a-f]{40}|[0-9a-f]{64})$ ]]; then
            echo "gh answered no commit hash for the tip of develop: $tip" >&2
            exit 1
          fi
          echo "tip=$tip" >> "$GITHUB_OUTPUT"
      - name: Check out the judged commit, keeping no credential
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.unit-tests.outputs.commit || 'refs/heads/develop' }}
          persist-credentials: false
      - name: Say what the run found
        id: say
        env:
          JUDGING_ENDED: ${{ needs.unit-tests.result }}
          JUDGED: ${{ needs.unit-tests.outputs.commit }}
          SUBJECT: ${{ needs.unit-tests.outputs.subject }}
          STEP_CHECKOUT: ${{ needs.unit-tests.outputs.checkout }}
          STEP_JUDGED: ${{ needs.unit-tests.outputs.judged }}
          STEP_JAVA: ${{ needs.unit-tests.outputs.java }}
          STEP_GRADLE: ${{ needs.unit-tests.outputs.gradle }}
          STEP_NODE: ${{ needs.unit-tests.outputs.node }}
          STEP_BROWSER: ${{ needs.unit-tests.outputs.browser }}
          STEP_FORMATTING: ${{ needs.unit-tests.outputs.formatting }}
          STEP_TOOL_TESTS: ${{ needs.unit-tests.outputs.tool-tests }}
          STEP_UNIT_TESTS: ${{ needs.unit-tests.outputs.unit-tests }}
          STEP_RESULTS: ${{ needs.unit-tests.outputs.results }}
          LOOKING_ENDED: ${{ needs.look.result }}
          MAIN_TIP: ${{ needs.look.outputs.main-tip }}
          DEVELOP_TIP: ${{ steps.develop.outputs.tip }}
          LACKING: ${{ needs.look.outputs.lacking }}
          MAIN_AHEAD: ${{ needs.look.outputs.main-ahead }}
          WORKFLOWS_CHANGED: ${{ needs.look.outputs.workflows-changed }}
          WORKFLOWS_DIFFERING: ${{ needs.look.outputs.workflows-differing }}
          PROMOTING_ENDED: ${{ needs.promote.result }}
          PUSHED: ${{ needs.promote.outputs.pushed }}
          GIT_SAID: ${{ needs.promote.outputs.git-said }}
        run: python3 tools/ci/develop_run_cli.py report "$RUNNER_TEMP/open-issues.json" >> "$GITHUB_OUTPUT"

  report:
    needs: [unit-tests, look, promote, say]
    if: ${{ !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/develop' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - name: Open the issue
        id: open
        if: needs.say.outputs.action == 'open'
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: ${{ needs.say.outputs.title }}
          BODY: ${{ needs.say.outputs.body }}
        run: |
          base64 -d <<< "$BODY" > "$RUNNER_TEMP/issue-body.md"
          gh issue create --repo "$GITHUB_REPOSITORY" --title "$TITLE" --body-file "$RUNNER_TEMP/issue-body.md"
      - name: Comment on the open issue
        id: comment
        if: needs.say.outputs.action == 'comment'
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ needs.say.outputs.issues }}
          BODY: ${{ needs.say.outputs.body }}
        run: |
          base64 -d <<< "$BODY" > "$RUNNER_TEMP/issue-body.md"
          gh issue comment --repo "$GITHUB_REPOSITORY" --body-file "$RUNNER_TEMP/issue-body.md" -- "$ISSUE"
      - name: Read develop's tip as it is now, when the core said close
        id: develop
        if: needs.say.outputs.action == 'close'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tip=$(gh api --method GET "repos/$GITHUB_REPOSITORY/git/ref/heads/develop" --jq .object.sha)
          if [[ ! $tip =~ ^([0-9a-f]{40}|[0-9a-f]{64})$ ]]; then
            echo "gh answered no commit hash for the tip of develop: $tip" >&2
            exit 1
          fi
          echo "tip=$tip" >> "$GITHUB_OUTPUT"
      - name: Close the issue, saying main now stands at the judged commit, only when every job before passed and that commit is still develop's tip
        id: close
        if: needs.say.outputs.action == 'close' && needs.unit-tests.result == 'success' && needs.look.result == 'success' && needs.promote.result == 'success' && needs.say.result == 'success' && steps.develop.outputs.tip == needs.unit-tests.outputs.commit
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUES: ${{ needs.say.outputs.issues }}
          BODY: ${{ needs.say.outputs.body }}
        run: |
          base64 -d <<< "$BODY" > "$RUNNER_TEMP/issue-body.md"
          for issue in $ISSUES; do
            gh issue comment --repo "$GITHUB_REPOSITORY" --body-file "$RUNNER_TEMP/issue-body.md" -- "$issue"
            gh issue close --repo "$GITHUB_REPOSITORY" -- "$issue"
          done
      - name: Say on the issue that main now stands at the judged commit but develop has moved on, when every job before passed and the core said close
        id: behind
        if: needs.say.outputs.action == 'close' && needs.unit-tests.result == 'success' && needs.look.result == 'success' && needs.promote.result == 'success' && needs.say.result == 'success' && steps.develop.outputs.tip != needs.unit-tests.outputs.commit
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUES: ${{ needs.say.outputs.issues }}
          JUDGED: ${{ needs.unit-tests.outputs.commit }}
          TIP: ${{ steps.develop.outputs.tip }}
        run: |
          link="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          body=$(printf '%s\n\nThe run: %s' "develop was judged green at $JUDGED, and main now stands there, but develop's tip is now $TIP, which this run did not judge, so this issue stays open until a run that judges develop's tip closes it." "$link")
          for issue in $ISSUES; do
            gh issue comment --repo "$GITHUB_REPOSITORY" --body "$body" -- "$issue"
          done
      - name: Open or comment on the issue saying only that the run is red, when nothing else did
        if: ${{ !cancelled() && steps.open.outcome != 'success' && steps.comment.outcome != 'success' && (failure() || needs.unit-tests.result != 'success' || needs.look.result != 'success' || needs.promote.result != 'success' || needs.say.result != 'success') }}
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: 'IMPORTANT: develop CI Failures'
        run: |
          link="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          body="A run for develop is red, and the jobs that say why could not, so only the run itself says what failed: $link"
          gh issue list --repo "$GITHUB_REPOSITORY" --state open --limit 1000 --json number,title > "$RUNNER_TEMP/open-issues.json"
          issue=$(jq -r --arg title "$TITLE" '[.[] | select(.title == $title) | .number] | min // empty' "$RUNNER_TEMP/open-issues.json")
          if [ -n "$issue" ]; then
            gh issue comment --repo "$GITHUB_REPOSITORY" --body "$body" -- "$issue"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$TITLE" --body "$body"
          fi
