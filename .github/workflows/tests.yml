name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    # The suite forks child JVMs. One that hangs would otherwise run the job to GitHub's own
    # six-hour limit, which reads as a stuck queue rather than as a failing test.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Java formatting (same command as local; fix with ./gradlew :TeamCode:spotlessApply)
        run: ./gradlew :TeamCode:spotlessCheck
      - name: Tool tests (same command as local)
        run: python3 tools/run_tests.py
      - name: Unit tests (same command as local)
        run: ./gradlew :TeamCode:testDebugUnitTest
      - name: Test report and simulation replays
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            TeamCode/build/test-results/testDebugUnitTest/*.xml
            TeamCode/build/sim/*.html
